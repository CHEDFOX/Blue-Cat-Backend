name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ulis
          POSTGRES_PASSWORD: ulis
          POSTGRES_DB: ulis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ulis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ULIS_TEST_DATABASE_URL: postgresql+psycopg://ulis:ulis@localhost:5432/ulis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check ulis tests migrations scripts
      - run: ruff format --check ulis tests migrations scripts
      - run: mypy ulis
      - run: python -m ulis.cli validate-config
      - run: pytest -q
