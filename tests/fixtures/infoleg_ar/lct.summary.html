              <script type="text/javascript">
              (function() {
                  var btn = document.getElementById('btn-volver-dinamico');
                  if (!btn) return;

                  var tieneReferrer = document.referrer !== "";
                  if (window.history.length > 1 && tieneReferrer) {
                      if (document.referrer.indexOf(window.location.hostname) !== -1) {
                          // Verificamos si el usuario viene de navegar entre pestañas de esta MISMA norma
                          // Ej: pathNormaActual = /normativa/nacional/norma-271486
                          var pathNormaActual = window.location.pathname; 
                          var vieneDePestanaInterna = document.referrer.indexOf(pathNormaActual) !== -1;

                          // Si NO viene de una pestaña interna (ej: viene del buscador), 
                          // usamos history.back() para que mantenga sus filtros de búsqueda.
                          if (!vieneDePestanaInterna) {
                              btn.onclick = function(e) {
                                  e.preventDefault();
                                  window.history.back();
                              };
                          }
                          // Si SÍ viene de una pestaña interna, no pisamos onclick, 
                          // usará el href que apunta a $url_fallback.
                      }
                  }
              })();
              </script>
