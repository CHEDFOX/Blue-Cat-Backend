[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ulis"
version = "0.1.0"
description = "Universal Legal Intelligence System - jurisdiction-aware legal corpus, retrieval and verification backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "defusedxml>=0.7.1",
  "anthropic>=1.13",
  # zstd for the object store (ulis/storage/object_store.py); Python 3.11-3.13 have no zstd in the standard library.
  "zstandard>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
ulis = "ulis.cli:main"

[tool.setuptools.packages.find]
include = ["ulis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires PostgreSQL (ULIS_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# git is invoked with a fixed argv (no shell); inputs are validated manifest values.
"ulis/sources/connectors/git_snapshot.py" = ["S603", "S607"]
"scripts/*" = ["S603", "S607"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
