# PLANNED - NOT INGESTED. SAOS (System Analizy Orzeczeń Sądowych, Interdisciplinary Centre of the University of Warsaw)
# is the open aggregator of Polish court judgments, but its robots.txt disallows its API. Read on 2026-10-14:
#   https://www.saos.org.pl/robots.txt - "User-agent: *" / "Disallow: /api/" / "Allow: /". The judgments are offered through
#        the API; nothing else of the site (its terms, its HTML judgment pages, any dump) was read or fetched.
#   Not checked: the Supreme Court (sn.pl), the Supreme Administrative Court (orzeczenia.nsa.gov.pl) and the common courts'
#        portal (orzeczenia.ms.gov.pl) - official sources whose robots.txt and terms are still to be read.
