# Mexico: "Leyes Federales Vigentes" of the Cámara de Diputados (https://www.diputados.gob.mx/LeyesBiblio/).
# PLANNED, nothing ingested: the texts are offered as PDF and Word files only, no reuse licence is stated, and ULIS has no
# PDF text extractor. Checked 2026-10-14 (robots.txt and the index page, 630 KB, read; no law file downloaded):
#   https://www.diputados.gob.mx/robots.txt                                  - HTTP 404 (no rules); this is not a block - the host answered.
#   https://www.diputados.gob.mx/LeyesBiblio/index.htm                       - the list of the federal laws in force (316 entries, "LXVI Legislatura"),
#        each with a "Última Reforma" date and links to "pdf/<ABBR>.pdf" and "doc/<ABBR>.doc" (some laws only "pdf_mov/...pdf"),
#        plus reform-history pages ("ref/<abbr>.htm"). No HTML or XML text of the laws. Footer: "© 2024 Honorable Cámara
#        de Diputados" with no licence. The page states: "La compilación de leyes y reglamentos federales que aquí se presenta
#        es sólo de carácter informativo y con el propósito de facilitar la consulta de sus textos vigentes. De conformidad
#        con lo que establecen los artículos 2o., 3o., 4o. y 5o. de la Ley del Diario Oficial de la Federación y Gacetas
#        Gubernamentales; 27, fracción XVI, de la Ley Orgánica de la Administración Pública Federal; y 3o. del Código Civil
#        Federal, el órgano de publicación con carácter oficial de la leyes, reglamentos y decretos federales, es el Diario
#        Oficial de la Federación."
