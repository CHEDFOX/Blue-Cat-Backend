  so 31 December 2013 is used as the edition date. Other hosts of this text (the Parliament, the National Peace and Reconciliation
  Commission, the Electoral Commission) are blocked (zw-parlzim-constitution).
- 'The number of section 1 is not printed in the text layer: its heading and sentence (''The Republic - Zimbabwe is a unitary,
  democratic and sovereign republic.'') are carried in the chapter heading shown with sections 2 to 7, not as a provision
  of their own. A few other headings were not recognised (their text stays in the preceding section and the note says so).
  The Act''s own sections 1 to 3 before the Schedule and the contents list are not stored.'
- The six Schedules of the Constitution are stored as blocks of paragraphs.
