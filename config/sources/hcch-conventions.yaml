  Disallow: /WEB-INF/ / Disallow: /en/search-results/ ..." and "Crawl-delay: 10". https://assets.hcch.net/robots.txt (the host of the
  documents): "User-agent: * / disallow: /upload/ / disallow: /catalogue/".
