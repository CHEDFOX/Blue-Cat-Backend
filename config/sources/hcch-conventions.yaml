    ULIS project, 2026-10-15. READ https://www.hcch.net/en/disclaimer: "The Permanent Bureau has established this site to facilitate and
    enhance public access to information about the work and achievements of the Hague Conference on Private International Law. While the
    Permanent Bureau makes every effort to ensure that information available on this site is updated and accurate, neither can be
    guaranteed, especially in non-official languages of the Organisation." and "Copyright notice: Reproduction of the information is
    authorised, except for commercial purposes, provided the source is duly acknowledged."; page footer "(c) HCCH 1951-2026. All Rights
    Reserved." Also fetched: the full-text page of one Convention (to see where the documents are served); no document was fetched.
  reviewed_on: 2026-10-15
  redistribution: allowed_with_conditions
  bulk_download: unknown
  automated_processing: unknown
  commercial_use: not_allowed
  attribution_required: true
  attribution_text: null
  conditions:
    - Source acknowledged; no commercial purposes. Whether ULIS's use is commercial is the owner's decision; until it is made as non-commercial, nothing is ingested.
  notes: >-
    Same wording as the UNIDROIT Disclaimer (source unidroit-instruments). The notice does not say whether automated retrieval or
    indexing is covered; the documents are PDFs on assets.hcch.net (not examined).
provenance: Two robots.txt files, the Disclaimer and one Convention full-text page fetched once each on 2026-10-15. Nothing stored.
