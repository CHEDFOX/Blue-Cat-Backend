# accepted for ULIS without a decision by the owner (the project's rule for NonCommercial terms). Read 2026-10-15.
schema_version: 1
id: hcch-conventions
name: HCCH - Conventions, Protocols and Principles (Hague Conference on Private International Law)
publisher: Hague Conference on Private International Law (HCCH, www.hcch.net)
kind: international_organisation
authority: official_non_authentic
jurisdictions: [INT]
document_kinds: [treaty]
languages: [en, fr]
