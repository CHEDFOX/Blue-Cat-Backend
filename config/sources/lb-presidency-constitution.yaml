- Amendments adopted after the edition date are not applied; no history is held.
- >-
  The page prints no edition date; the retrieval date is the edition date. It shows amendments up to the constitutional
  law of 4 September 2004 (note before article 49); an amendment adopted later would not be in it.
- >-
  The notes of the amending laws ("المعدلة بالقانون الدستوري ...") that the page prints after an article's number are kept
  as notes of that article, not as its text.
- >-
  Articles repealed by amendment (90 to 94, 96 to 100, and 22, 23) are printed by the site as a heading with the note of
  repeal and no text; they are stored as the site prints them. A heading that lists several articles ("المواد 90 و91 و92")
  is stored as the article with the first number (art-90), the rest of that heading ("و91و92") as its heading; the articles
  named after the first one have no unit of their own.
- >-
  Arabic only. The page prints the Parts ("الباب") and Chapters ("الفصل") as headings; they are kept as the context of the
  articles below them.
