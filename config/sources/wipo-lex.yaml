# WIPO Lex (www.wipo.int/wipolex): REJECTED, nothing ingested. The Terms of Use forbid automated queries, bulk downloading and web scraping
# and allow reproduction of the texts only for "academic, research and non-commercial purposes"; robots.txt also disallows the folder
# of the database's law files (/edocs/lexdocs/). Read 2026-10-15 (pages cached under var/sources/www.wipo.int/).
schema_version: 1
id: wipo-lex
name: WIPO Lex - intellectual property laws, treaties and judgments (World Intellectual Property Organization)
publisher: World Intellectual Property Organization (www.wipo.int/wipolex)
kind: international_organisation
authority: official_non_authentic
jurisdictions: [INT]
document_kinds: [act, treaty, judgment]
languages: [en, fr, es, ar, ru, zh]
coverage: >-
  The WIPO Lex database: IP laws and regulations notified to WIPO and the WTO, IP treaties and judgments of WIPO Members. ULIS ingests
  nothing from it.
access:
  method: permitted_web_retrieval
  endpoint: https://www.wipo.int/wipolex/en
  authentication: null
update_frequency: Not stated.
rate_limits: >-
  https://www.wipo.int/robots.txt (HTTP 200, read 2026-10-15): "User-agent: *" with, among others, "Disallow: /edocs/lexdocs/",
  "Disallow: /treaties/en/notifications/", "Disallow: /treaties/*/judgments/" and "Disallow: /meetings/pdocs/"; the site is not closed, but
  the folder of WIPO Lex's law files is. The Terms of Use (below) limit search actions to 10 per minute from one IP address.
licence:
  id: WIPO-LEX-TERMS
  name: WIPO Lex Database Terms of Use (reproduction for academic, research and non-commercial purposes; no automated queries, bulk download or scraping)
  url: https://www.wipo.int/en/web/wipolex/terms-of-use
  review_status: rejected
  reviewed_by: >-
    ULIS project, 2026-10-15. READ https://www.wipo.int/en/web/wipolex/terms-of-use. 2.1.1: "The User is allowed to reproduce the IP Legal
    Texts and Translated Texts for academic, research and non-commercial purposes, provided that the original source and "WIPO Lex" are
    acknowledged." 2.2: "Any abusive use of the WIPO Lex Database is prohibited and the User is therefore forbidden to: ... b. perform
    automated queries; c. perform bulk acquisition, bulk downloading and bulk storing of data; d. perform bulk copying, bulk reformatting,
    bulk sharing and bulk redistributing of data; e. perform web scraping". 2.3: "Under no circumstances may the data made available through
    WIPO Lex Database be sold or sublicensed by the User in any way without WIPO's permission." 4.2: "WIPO cannot guarantee that a text in
    the database is an exact reproduction of the officially adopted text". 1.2.f: some texts come from "Credible legal databases and third
    parties from which permission to reproduce the texts in the WIPO Lex Database has been sought". robots.txt read as above.
  reviewed_on: 2026-10-15
  redistribution: not_allowed
  bulk_download: not_allowed
  automated_processing: not_allowed
  commercial_use: not_allowed
  attribution_required: true
  attribution_text: null
  conditions:
    - Not ingested. The terms forbid automated queries, bulk downloading and scraping, so retrieval for ULIS is not allowed whatever the use; the texts are also not guaranteed to be exact reproductions of the adopted text.
    - The national laws and treaties WIPO Lex lists are published by their own States and depositaries; those are the sources to take them from (the national sources of the corpus).
  notes: Recorded by the international instruments sweep; the finding above is what the pages said when read.
provenance: robots.txt, the Terms of Use and the database home page fetched once each on 2026-10-15. Nothing stored.
known_limitations:
  - Not ingested.
status: rejected
