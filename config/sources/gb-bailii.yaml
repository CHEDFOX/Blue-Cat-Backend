# REJECTED - NOT INGESTED. BAILII (British and Irish Legal Information Institute) holds the widest free collection of UK and Irish judgments, and
# its robots.txt closes exactly those parts to robots. Re-read on 2026-10-16 (cached under var/sources/www.bailii.org/):
#   https://www.bailii.org/robots.txt (200) - "User-agent: *" / "Disallow: /eu" "/ew" "/ie" "/je" "/nie" "/scot" "/sh" "/uk" "/wales" "/worldlii" (and
#        the same as Noindex); "User-agent: GPTBot" / "Disallow: /". /ew/ (England and Wales), /uk/ (UK-wide courts and tribunals), /scot/ (Scotland),
#        /nie/ (Northern Ireland), /ie/ (Ireland), /wales/ and /eu/ are the case-law collections.
#   https://www.commonlii.org/robots.txt - HTTP 403 for ULIS's identifying User-Agent (a refusal; nothing else is fetched from the host).
#   Conclusion: automated retrieval of BAILII's collections is forbidden by its robots.txt. ULIS does not reopen it: no other user agent, no
#        mirror of unclear licence. The courts' own sites are used where they allow it (gb-uksc-judgments, gb-uksc-judgments-pdf, gb-jcpc-judgments,
#        gb-jcpc-judgments-pdf, gb-govuk-tribunal-decisions, gb-ni-judiciary-judgments); the Court of Appeal and High Court of England and
#        Wales, the Scottish archive and the House of Lords are not covered (see gb-find-case-law, gb-hl-judgments, gb-scotcourts-judgments).
