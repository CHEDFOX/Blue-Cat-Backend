schema_version: 1
id: jp-egov-laws
name: e-Gov 法令検索 (e-Gov Law Search), 法令API Version 2
publisher: Digital Agency (デジタル庁), Government of Japan
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [JP]
document_kinds: [constitution, act]
languages: [ja]
coverage: >-
  The Constitution, Acts, Cabinet Orders, Imperial Ordinances, Ministerial Ordinances and Rules
  of Japan as amended (現行法令), with every revision since the data baseline of 1 April 2017
  (平成29年4月1日), including amendments promulgated but not yet in force. ULIS ingests a
  selected list of laws from the API (XML responses), with the full revision history for some.
access:
  method: api
  endpoint: config/manifests/jp-egov-laws.yaml
update_frequency: >-
  Each time a law is promulgated in the Official Gazette (官報), by enforcement date (help page).
rate_limits: >-
  No published numeric limit and no API key. laws.e-gov.go.jp has no robots.txt (the path
  returns the single-page application, checked 2026-10-14), so the ULIS default of one request
  every 5 seconds applies. Digital Agency's API prototype notes ask users not to put load on the
  servers (bulk or bot access may be restricted); the manifest keeps requests to a few dozen.
licence:
  id: PDL-1.0
  name: 公共データ利用規約（第1.0版） / Public Data License 1.0 (compatible with CC BY 4.0)
  url: https://www.digital.go.jp/resources/open_data/public_data_license_v1.0
  review_status: approved
  reviewed_by: >-
    ULIS project - e-Gov 法令検索 terms (https://laws.e-gov.go.jp/terms): copyright in the
    site belongs to the Digital Agency unless stated otherwise and the Public Data License 1.0
    applies; site-specific points in https://www.digital.go.jp/copyright-policy#important.
    PDL1.0 s 1: anyone may copy, transmit, adapt and otherwise freely use the content,
    including commercially, subject to s 1.1-1.7; s 1.7: compatible with CC BY 4.0 and use
    under CC BY is permitted. Help page (https://laws.e-gov.go.jp/help) offers the data as XML
    for secondary use (二次利用) and documents the public API (https://laws.e-gov.go.jp/api/2/swagger-ui/).
  reviewed_on: 2026-10-14
  redistribution: allowed_with_conditions
  bulk_download: allowed
  automated_processing: allowed_with_conditions
  commercial_use: allowed
  attribution_required: true
  attribution_text: >-
    出典：e-Gov法令検索（デジタル庁）（https://laws.e-gov.go.jp/）、PDL1.0。ULISが構造化・索引化のために加工して作成
    (Source: e-Gov Law Search, Digital Agency, PDL1.0; structured and indexed by ULIS).
  conditions:
    - Credit the source (PDL1.0 s 1.1) - every result carries the attribution text.
    - State that the content was edited or processed and by whom, and never present processed data as unprocessed government output (PDL1.0 s 1.1).
    - Do not represent the text as the authentic law - the Official Gazette (官報) prevails over the e-Gov data (help page, 免責事項).
    - Keep request volume low (Digital Agency asks API users not to put load on the servers).
  notes: >-
    Statutes themselves are outside copyright under Copyright Act art 13 (to verify); the
    licence covers the e-Gov data and site. Counsel review still recommended before production use.
provenance: >-
  Data prepared by the Ministry of Justice reflecting each amendment, checked by the ministries
  concerned and published by the Digital Agency (help page). Fetched from
  https://laws.e-gov.go.jp/api/2/law_data/{law_revision_id}?response_format=xml and
  /api/2/law_revisions/{law_id}?response_format=xml; raw responses are stored unchanged.
known_limitations:
  - Not the authentic text. The help page states that where the e-Gov data differs from the Official Gazette (官報) the Gazette prevails, and that notation may differ from the Gazette for editorial reasons.
  - Revision history only from the data baseline of 1 April 2017; earlier wordings are not available from this source.
  - Per-provision dates are not stated - each revision is a whole-law snapshot dated by the amendment's enforcement date (施行期日).
  - Ruby readings (furigana) are dropped from indexed text; tables, figures and forms are flattened or omitted.
  - Official English translations (Japanese Law Translation) are a different, unofficial source and are not ingested.
status: active
connector: egov_laws
parser: egov_law_xml
