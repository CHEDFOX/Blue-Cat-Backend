schema_version: 1
id: jp-egov-laws
name: e-Gov 法令検索 (e-Gov Law Search), 法令API Version 2
publisher: Digital Agency (デジタル庁), Government of Japan
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [JP]
document_kinds: [constitution, act, cabinet_order, imperial_ordinance, ministerial_ordinance, rule]
languages: [ja]
coverage: >-
  The Constitution, Acts, Cabinet Orders, Imperial Ordinances, Ministerial Ordinances and Rules
  of Japan as amended (現行法令), with every revision since the data baseline of 1 April 2017
  (平成29年4月1日), including amendments promulgated but not yet in force. ULIS ingests every law
  in force that the API's own list endpoint names (8,989 on 2026-10-15: the Constitution, Acts,
  Cabinet Orders, Imperial Orders, Ministerial Ordinances and Rules), in the revision in force,
  with the full revision history for two (刑法, 個人情報の保護に関する法律). Laws repealed, expired,
  suspended or without effect (廃止・失効・停止・実効性喪失, 561) and laws none of whose revisions is in
  force yet (14) are not ingested.
access:
  method: api
  endpoint: config/manifests/jp-egov-laws.yaml
update_frequency: >-
  Each time a law is promulgated in the Official Gazette (官報), by enforcement date (help page).
rate_limits: >-
  No published numeric limit and no API key. laws.e-gov.go.jp has no robots.txt (the path
  returns the single-page application, checked 2026-10-14), so the ULIS default of one request
  every 5 seconds applies. Digital Agency's API prototype notes ask users not to put load on the
  servers (bulk or bot access may be restricted). The widened manifest needs two requests per law
  (revision list, then text): about 18,000 requests, 25 hours at 5 seconds; a refusal (401, 403,
  429, 451) stops the run, and the responses are cached, so a repeated run costs no requests.
