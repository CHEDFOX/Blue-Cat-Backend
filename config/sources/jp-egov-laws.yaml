  attribution_required: true
  attribution_text: >-
    出典：e-Gov法令検索（デジタル庁）（https://laws.e-gov.go.jp/）、PDL1.0。ULISが構造化・索引化のために加工して作成
    (Source: e-Gov Law Search, Digital Agency, PDL1.0; structured and indexed by ULIS).
