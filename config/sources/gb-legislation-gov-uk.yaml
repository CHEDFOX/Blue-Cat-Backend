# Primary legislation of the United Kingdom, Scotland, Wales and Northern Ireland from legislation.gov.uk (The National Archives). Terms and
# access rules (read 2026-10-15, re-read 2026-10-16; cached under var/sources/):
#   https://www.legislation.gov.uk/fair-use-policy - identify the bot; follow robots.txt; "You must not exceed the request rate limit of 1,500
#        requests in any 5-minute period"; "Consider using another way to get legislation.gov.uk data: if you want to carry out a large, one-off
#        crawl of all or part of the content, or ... extract new legislation as it is published or republished, you should use a different way to
#        download content" - the pages that follow name only the New Legislation feed and the Publication Log feed, which list new and changed
#        items and are no archive; "we encourage the downloading of data for re-use".
#   https://www.legislation.gov.uk/robots.txt - "User-agent: *" / "Crawl-delay: 5" / "Disallow: */data.pdf", "*/data.docx", "/defralex".
#   https://legislation.github.io/data-documentation/reuse-licence.html - all content under the Open Government Licence v3.0, "free of charge,
#        for commercial and non-commercial uses"; dual licences for content derived from EUR-Lex and from Westlaw (pre-1987 secondary legislation).
#   https://legislation.github.io/data-documentation/what-we-have.html - "We only hold a partial dataset of UK legislation texts": the text of
#        "almost all UK primary and secondary legislation published since 1988" (XML), "revised XML versions of most pre-1988 UK Public General
#        Acts in force as of 1st February 1991 (the base date)"; "Most UK primary legislation we hold that was enacted before 1988 is currently
#        only available as PDF" (the King's Printer scans, no text layer; robots.txt disallows */data.pdf anyway).
#   https://research.legislation.gov.uk/ (the "Legislation Data Research Infrastructure" with bulk downloads, announced by search results) answers
#        HTTP 401 for /robots.txt: a refusal, not retried and not worked around; nothing is fetched from that host.
#   The listing feeds (/<type>/data.feed?results-count=1000&page=N) are what the developer pages offer for finding the items; the formats of each
#        item (data.akn, data.xml, data.pdf ...) are listed in its feed entry, so the items that exist as XML are known before any is fetched.
schema_version: 1
id: gb-legislation-gov-uk
name: legislation.gov.uk - primary legislation
publisher: The National Archives (UK)
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [GB, GB-EAW, GB-WLS, GB-SCT, GB-NIR]
document_kinds: [act, measure]
languages: [en]
coverage: >-
  Every Act, Measure and Order in Council that legislation.gov.uk holds as Akoma Ntoso XML (7,178 works), as the site gives it: UK Public
  General Acts (4,393 of 17,560 listed), UK Local Acts (199 of 20,171), Acts of the Scottish Parliament (402), the National Assembly for Wales
  and Senedd Cymru (44 + 34) and Measures of the Assembly (22), Acts of the Northern Ireland Assembly (238), Measures of the Northern Ireland
  Assembly (2), Acts of the Parliament of Northern Ireland 1921-1972 (287), Northern Ireland Orders in Council (558), UK Church Measures (157),
  and the older parliaments' Acts that the site holds as XML: England (664), Scotland (109), Great Britain (58), Ireland (11). Each work comes
  with all its versions: the enacted text where the work has no later version (926 works), otherwise every point-in-time version the lifecycle
  lists, from the first the site holds (the enactment date, or the base date 1991-02-01 / 2006-01-01 for older Acts) to the latest. Repealed Acts
  are included with their history. Items the site holds only as PDF scans (13,167 UK Public General Acts, 19,972 Local Acts, 869 Private Acts,
  2,160 Acts of Great Britain and others) have no text on the site and are not ingested.
access:
  method: api
  endpoint: config/manifests/gb-legislation-gov-uk.yaml
update_frequency: continuous (editorial); re-run scripts/build_legislation_gov_uk_manifest.py and the ingest to refresh
rate_limits: >-
  Fair use policy (see the header): identify with a User-Agent with contact details; obey robots.txt (Crawl-delay 5); at most 1,500 requests per
  5 minutes. ULIS makes one request every 5 seconds (60 per 5 minutes), one at a time, and caches every response. Whole manifest (7,178 works):
  about 24,700 documents, 28,200 requests (a document each, plus the versions that answer 404 once) = about 39 hours at the crawl delay, after
  53 listing requests (the listing of primary and secondary legislation took 209); about 2.75 million provision versions, 10.7 GB of database,
  9.2 GB of raw responses (estimated from a slice, plus or minus 50 percent). The connector stops on any refusal (401/403/451/429), records a missing work and goes on, and
  gives up after five failures in a row.
licence:
  id: OGL-UK-3.0
  name: Open Government Licence v3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  review_status: approved
  reviewed_by: ULIS project - site footer states "All content is available under the Open Government Licence v3.0 except where otherwise stated"; fair-use policy encourages downloading data for re-use
  reviewed_on: 2026-10-16
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: allowed_with_conditions
  attribution_required: true
  attribution_text: Contains public sector information licensed under the Open Government Licence v3.0.
  conditions:
    - Attribution as required by the OGL.
    - Follow the legislation.gov.uk fair use policy and robots.txt.
    - Content derived from EUR-Lex on the site is reused under Commission Decision 2011/833/EU.
  notes: Counsel review still recommended before production use.
provenance: Official publisher of UK legislation (The National Archives); revised texts maintained by its editorial team.
known_limitations:
  - >-
    Only what the site holds as XML is ingested. About 13,000 UK Public General Acts, 19,900 Local Acts, 870 Private and Personal Acts, 2,160
    Acts of Great Britain and 273 Local Acts of Great Britain exist on the site only as scans of the printed Acts (no text layer): their text is
    not available to ULIS (no OCR). Of the older Acts mostly those still in force on 1991-02-01 have XML.
  - >-
    Welsh-language versions of Welsh legislation are not fetched (English only). Retained EU law and EU-origin legislation published on the site
    (types eur, eut, eudn, eudr) are not part of this source (EU market).
  - >-
    The history is the site's: its revised versions start on the enactment date for Acts enacted from 1991, on 1991-02-01 for older UK Acts and
    on 2006-01-01 for older Northern Ireland legislation; amendments are recorded by the site from 1994 on (some earlier ones are missing), so a
    pre-1994 amendment of an older Act may be absent from the versions. The original (as enacted) text of an Act that has later versions is not
    stored separately: the first version is the site's point-in-time text on its first date. Acts of 1988-1990 therefore start on 1991-02-01.
  - >-
    An Act whose latest version has no text at all (the site removes the text of some Acts repealed in full) is skipped for that version; the earlier
    versions are stored and their provisions have no end date. The title of a repealed Act carries the site's label "(repealed ...)".
  - >-
    A version of an old Act that has no sections (the Acts of the Old Scottish Parliament) is one unit of text ("the Act") with no start date.
  - >-
    Revised texts may have outstanding effects not yet applied; these are reported as limitations. Revised versions are editorial consolidations,
    not the authentic enacted text.
  - >-
    Cross-references from one Act to an Act before 1963 use the calendar-year form (ukpga/1945/18), which does not identify those Acts (two sessions
    can share a year and chapter number); their work identity here is the regnal-year path (/gb/ukpga/Geo6/9-10/18), so such links stay unresolved.
status: active
connector: legislation_gov_uk
parser: legislation_gov_uk_akn
