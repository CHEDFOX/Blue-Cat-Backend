coverage: >-
  Retsinformation holds Danish laws and regulations in force in 1985 or issued since (current and
  historic), Folketing documents, Ombudsman opinions and administrative decisions; Lex Dania XML
  with content exists for documents published after 24 September 2007. ULIS ingests the official
  consolidations (lovbekendtgørelser, LBK H) in force: the six pilot Acts (with earlier consolidations
  for Forvaltningsloven and Funktionærloven) and the other lovbekendtgørelser that the ELI metadata
  marks as in force among the Lovtidende A documents classified so far, newest first (the header of
  the manifest says how many of the 34,435 candidates since 2007 that is). The classified part is a
  fraction of the whole: the manifest is widened with scripts/build_dk_manifest.py.
# Retsinformation (Civilstyrelsen): Danish legislation as Lex Dania XML by ELI. Terms, access rules
# and documentation read on 2026-10-14 from the publisher's own pages (cached under var/sources/):
#   https://www.retsinformation.dk/api (content: /static/api.html) - "Betingelser for anvendelse af
#        Civilstyrelsens åbne data": "Civilstyrelsen giver gratis, ikke-eksklusiv og ubegrænset brugsret til åbne
#        data fra Retsinformation. Data kan bl.a.: kopieres, distribueres og offentliggøres; ændres og sammensættes med
#        andet materiale; bruges kommercielt og ikke-kommercielt". "Love og regler er ikke underlagt ophavsret, jf.
#        ophavsretslovens § 9." Vilkår: data must not be used so that Civilstyrelsen appears to support, recommend or
#        market the user or its products; "Brugen af services må ikke belaste Civilstyrelsens datagrænseflade på en
#        uhensigtsmæssig eller uforholdsmæssig måde"; Civilstyrelsen may change how documents are extracted.
#   https://www.retsinformation.dk/faq (content: /static/faq.json) - data access: "Dokumenter er tilgængelige i
#        formaterne pdf, xml og rawhtml" (e.g. https://www.retsinformation.dk/eli/lta/2022/1655/xml), ELI metadata as
#        ttl/rdf/json; "Der gælder samme vilkår for anvendelse af data via ELI channels som for REST API høste-
#        webservicen"; "En lovbekendtgørelse er en sammenskrivning af en lov eller lovbekendtgørelse med senere
#        ændringer. Lovbekendtgørelser udarbejdes af den myndighed, som er ansvarlig for loven ... udarbejdes sjældent
#        med det samme, at en ændringslov er trådt i kraft"; "Den historiske markering på Retsinformation er vejledende
#        og uden retlig betydning"; ministries are responsible for the content of their documents.
#   https://www.retsinformation.dk/about (content: /static/about.html) - Folketinget and the ministries produce, own
#        and are responsible for the documents; Lex Dania is the common production system for Lovtidende and
#        Retsinformation; publication on lovtidende.dk and retsinformation.dk is simultaneous.
#   https://api.retsinformation.dk/swagger/v1/swagger.json - harvest API (change feed): "Servicen kan kun benyttes i
#        tidsrummet fra kl. 03:00 til 23:45. Servicen kan desuden kun kaldes en gang pr. 10 sekunder"; date parameter
#        format YYYY-MM-DD within the last 10 days. Not used by ULIS (documents are fetched by ELI).
#   ELI documentation (/static/eli-parameters-documentation.json): XML "Lex Dania XML ... content and metadata in
#        Lex Dania XML only exists for documents published after the date 24-09-2007". ELI metadata of each document
#        gives legal_value "official" for the xml/html formats and "definitive" for the signed PDF (Lovtidende A).
#   https://www.retsinformation.dk/sitemap.xml (declared in robots.txt; 21 files of 10,000 addresses, 200,007 documents
#        of every kind, 62,213 of them Lovtidende A "/eli/lta/<year>/<number>", read 2026-10-15) - the ELI sitemap lists
#        the ELI of each document and its last-modified date but NOT its type. Retsinformation has no public list of the
#        lovbekendtgørelser (the website's search is a JavaScript application; the harvest API only serves the last 10 days).
#   https://www.retsinformation.dk/eli/lta/<year>/<number>.json (FAQ: "Dokumenters ELI-metadata er tilgængelige i formaterne
#        ttl, rdf og json") - the ELI metadata of a document, about 50 kB: type_document (".../type_document#LBKH" for a
#        lovbekendtgørelse), in_force ("InForce-inForce" / "InForce-notInForce"), the date and titles, and the links
#        consolidates / consolidated_by / changed_by. scripts/build_dk_manifest.py asks for it once for each candidate,
#        one request per 10 s, and keeps the LBKH that are in force.
#   robots.txt (read first): www.retsinformation.dk/robots.txt -> only "Sitemap: https://retsinformation.dk/sitemap.xml"
#        (no Disallow, no Crawl-delay); api.retsinformation.dk/robots.txt -> 404.
schema_version: 1
id: dk-retsinformation
name: Retsinformation - lovbekendtgørelser (Lex Dania XML)
publisher: Civilstyrelsen (Danish Agency of Family Law and Civil Affairs, Ministry of Justice) - retsinformation.dk
kind: official_legislation_portal
# The XML is an official format but not the authentic publication: Lovtidende A (signed PDF, ELI legal
# value "definitive") is. A lovbekendtgørelse is itself an official consolidation published in Lovtidende A.
authority: official_non_authentic
jurisdictions: [DK]
document_kinds: [act]
languages: [da]
coverage: >-
  Retsinformation holds Danish laws and regulations in force in 1985 or issued since (current and
  historic), Folketing documents, Ombudsman opinions and administrative decisions; Lex Dania XML
  with content exists for documents published after 24 September 2007. ULIS ingests the official
  consolidations (lovbekendtgørelser, LBK H) of six Acts listed in the manifest, with earlier
  consolidations for Forvaltningsloven and Funktionærloven.
access:
  method: api
  endpoint: config/manifests/dk-retsinformation.yaml
  authentication: none
update_frequency: at least daily ("opdateres mindst én gang i døgnet", https://www.retsinformation.dk/about)
rate_limits: >-
  No crawl delay in robots.txt. The harvest API allows one call per 10 s between 03:00 and 23:45;
  ULIS keeps one request per 10 s for documents too (the connector refuses a smaller delay),
  identifies itself, caches every response and stops on any refusal. Making the manifest costs 22 sitemap requests and
  one metadata request for each Lovtidende A document classified (34,435 since 2007: about 96 hours at 10 s;
  about 4.8 hours for each year of candidates); each lovbekendtgørelse found costs one more request for its XML.
licence:
  id: DK-RETSINFORMATION-OPEN-DATA
  name: Civilstyrelsen - betingelser for anvendelse af åbne data (free, non-exclusive, unrestricted right of use); Acts not protected by copyright (ophavsretsloven § 9)
  url: https://www.retsinformation.dk/api
  review_status: approved
  reviewed_by: >-
    ULIS project, from the publisher's own terms page (https://www.retsinformation.dk/api), FAQ and
    about pages, the harvest API description and robots.txt, read 2026-10-14 (quoted in the
    comments above). The terms grant a free, non-exclusive and unrestricted right to copy,
    distribute, publish, modify, combine and use the data commercially and non-commercially, and
    state that laws and regulations are not protected by copyright (ophavsretsloven § 9).
  reviewed_on: 2026-10-14
  redistribution: allowed
  bulk_download: allowed_with_conditions
  automated_processing: allowed
  commercial_use: allowed
  attribution_required: false
  attribution_text: >-
    Kilde: Retsinformation (www.retsinformation.dk), Civilstyrelsen. Lovbekendtgørelser gengivet fra
    Lex Dania XML; den autentiske tekst er offentliggjort i Lovtidende. Struktur normaliseret af ULIS.
  conditions:
    - Do not use the data so that Civilstyrelsen appears to support, recommend or market ULIS or its users (terms, "Vilkår").
    - Do not burden the data interface inappropriately or disproportionately - one request per 10 s, cached; the sitemap, the ELI metadata of the candidates and the XML of the documents in the manifest.
    - Do not present the consolidation as the authentic text; Lovtidende is authentic and the enacted acts prevail (stated on every result).
  notes: >-
    The terms require no attribution; ULIS attributes anyway. Works such as photographs reproduced in a
    regulation may be protected outside it (ophavsretslovens § 9, stk. 2); none are ingested.
    Counsel review still recommended before production use.
provenance: >-
  https://www.retsinformation.dk/eli/lta/{year}/{number}/xml (Lex Dania XML, produced in the same
  system as the Lovtidende publication) fetched with an identifying User-Agent; each response is
  cached with its URL and retrieval time under var/sources/www.retsinformation.dk/ and stored
  unchanged (SHA-256 addressed). Consolidation chains were found from the documents' ELI metadata
  (consolidates / consolidated_by / changed_by).
known_limitations:
  - Lovbekendtgørelser are official consolidations, not the enacted acts; in case of inconsistency the acts as published in Lovtidende prevail (to verify), and the XML is not the authentic (signed PDF) publication.
  - Consolidations lag amendments; amending acts made after a consolidation are reported as outstanding changes (current consolidation) or lifecycle events, not merged into the text.
  - Versions are dated by the consolidation's date (Meta/DiesSigni), not by when each wording took effect; the amending acts' commencement provisions are reproduced as text only.
  - Retsinformation's current/historic marking is indicative and has no legal effect (FAQ).
  - No structured XML content for documents before 24 September 2007 (e.g. Danmarks Riges Grundlov of 1953).
  - Documents' XML changes when their metadata changes (e.g. when marked historic); a re-fetched document is then refused as a conflict with the version already recorded.
  - PARTIAL. There is no public list of lovbekendtgørelser, and the ELI sitemap has no document types, so the type of each Lovtidende A document is found one metadata request at a time. The manifest holds the lovbekendtgørelser in force among the documents classified so far (newest first); a law whose current consolidation is older is missing until the manifest is widened (scripts/build_dk_manifest.py --from-year, resumable).
  - Lovbekendtgørelser marked in force but whose XML has no structured content, or a structure the parser does not know, are reported as ingest errors and skipped. A law without a popular title is named by its consolidation's title ("lov om fleksydelse"); preambles and annexes are not ingested.
status: active
connector: retsinformation
parser: retsinformation_lexdania
