# Constitution of Cabo Verde from Assembleia Nacional de Cabo Verde (parlamento.cv). Read on 2026-10-15/16, before any document was fetched:
#   robots.txt - www.parlamento.cv/robots.txt - HTTP 404 (no robots.txt): no crawling rules to apply. The connector reads it anyway
#   Terms - page footer: "© Assembleia Nacional. Todos os Direitos Reservados." - a generic footer; no terms-of-use or licence page was found.
#        The page itself says "Este texto não substitui o original publicado no Boletim Oficial."
#   The document - The page "Constituição da República" (https://www.parlamento.cv/Constituicao/) prints the whole text under the heading
#        "CONSTITUIÇAO DA REPÚBLICA DE CABO VERDE / 2ª Revisão Ordinária - 2010": preamble and articles 1 to 295 in seven parts. The page
#        prints "(Artigo 162º)" in brackets, which the parser does not read as a heading.
schema_version: 1
id: cv-parlamento-constitution
name: Constitution of Cabo Verde - Assembleia Nacional de Cabo Verde (parlamento.cv)
publisher: Assembleia Nacional de Cabo Verde (parlamento.cv)
