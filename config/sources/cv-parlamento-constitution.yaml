access:
  method: permitted_web_retrieval
  endpoint: config/manifests/cv-parlamento-constitution.yaml
  authentication: none
update_frequency: Not stated; the retrieval date is the edition date unless the document prints one.
rate_limits: >-
  As recorded under robots.txt in the header; ULIS waits at least 5 s between requests (the Crawl-delay when it is longer),
  identifies itself, caches every download and makes 2 request(s) (robots.txt and 1 document(s)).
licence:
  id: CV-official-text-no-terms
  name: >-
    Official legal text published by Assembleia Nacional de Cabo Verde (parlamento.cv); no terms of reuse found (page footer:
    "© Assembleia Nacional. Todos os Direitos Reservados." - a generic footer; no terms-of-use or licence page ...
  url: https://www.parlamento.cv/
  review_status: approved
  reviewed_by: >-
    ULIS project (not counsel), 2026-10-16, from the publisher's own pages quoted in the header of this file: robots.txt (www.parlamento.cv/robots.txt
    - HTTP 404 (no robots.txt): no crawling rules to apply. The connector reads it anyway) and the terms (page footer: "©
    Assembleia Nacional. Todos os Direitos Reservados." - a generic footer; no terms-of-use or licence page was found. The
    page itself says "Este texto não substitui o original publicado no Boletim Oficial."). The page "Constituição da República"
    (https://www.parlamento.cv/Constituicao/) prints the whole text under the heading "CONSTITUIÇAO DA REPÚBLICA DE CABO VERDE
    / 2ª Revisão Ordinária - 2010": preamble and articles 1 to 295 in seven parts. The page prints "(Artigo 162º)" in brackets,
    which the parser does not read as a heading. The Constitution is an official legal text; no statute excluding official
    texts from copyright was read on the publisher's pages (to verify). Reading: AMBER - the publisher states no restriction
    on reusing the text beyond a generic notice; no permission for automated retrieval is stated either.
  reviewed_on: '2026-10-16'
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: unknown
  attribution_required: true
  attribution_text: >-
    Constitution of Cabo Verde, Assembleia Nacional de Cabo Verde (parlamento.cv); retrieved {retrieved_date}. Structured
    and indexed by ULIS; not the authentic text and not endorsed by the publisher.
  conditions:
  - >-
    The text is the publisher's copy (pt), not the authentic publication; amendments after the edition date are not applied.
  - >-
    Polite retrieval (identifying User-Agent, 5 s between requests or the Crawl-delay, cached downloads); stop on any refusal.
  notes: >-
    The basis is the official status of the text and the absence of any stated restriction on it; there is no licence. Counsel
    review is recommended before production use.
provenance: >-
  The document(s) listed in config/manifests/cv-parlamento-constitution.yaml, stored byte for byte inside JSON bundles with
  the URL and retrieval time; the text is re-derived from the page or from the PDF's text layer (pdftotext).
known_limitations:
- >-
  A copy on the publisher's site, not the authentic publication of the constitution; the publisher's own edition date (if
  any) is the edition date, else the retrieval date.
- Amendments adopted after the edition date are not applied; no history is held.
- >-
  The page is the Assembly's copy of the text of the 2010 revision and says it does not replace the original published in
  the Boletim Oficial; later revisions, if any, are not applied.
- >-
  The heading of article 162 is printed in brackets on the page and is not recognised: its text is kept in article 161, whose
  note says so.
status: active
connector: constitution_docs
parser: constitution_text
