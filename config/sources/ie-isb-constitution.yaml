known_limitations:
- A copy on the publisher's site, not the authentic publication of the constitution; the publisher's own edition date (if any)
  is the edition date, else the retrieval date.
- Amendments adopted after the edition date are not applied; no history is held.
- The Irish text (Bunreacht na hÉireann) prevails over the English text where they differ (Constitution, Art. 25.5.4°; to verify);
  both are the site's conversions, not the signed and enrolled text.
- The page prints no edition date; the list of the amending Acts is not stored (it precedes the Preamble). The alphabetical index
  (INDEX / TREOIR) at the end is stored as blocks.
