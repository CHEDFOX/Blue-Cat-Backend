provenance: >-
  https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=<PCode> (one page per law, HTML), fetched
  with PoliteHttp and stored unchanged. Footer: 本網站法規資料係由政府各機關提供之電子檔或書面文字登打製作，若與各法規主管機關之公布文字有所不同，仍以各法規主管機關之公布資料為準
  (the data is made from electronic files or printed text supplied by the agencies; where it
  differs from the text published by the competent authority, the published text prevails). The
  authentic text of a law is its promulgation in the Presidential Office Gazette (總統府公報).
known_limitations:
  - Orders (命令) and administrative rules are classed as regulations by their names; a name that is not a statute name (法/律/條例/通則) is taken to be an order or rule. A page the parser cannot read without guessing (an item number that jumps because two items share a line in the source; a 生效狀態 memo that names no article) is reported as an error, not guessed. Numbered lists below the 目 level are kept in the text of the 目.
  - Not the authentic text; the text published by the competent authority (for laws, the Presidential Office Gazette) prevails.
  - Current consolidation only, without per-article dates; each text is attested at the consolidation cut-off date (法規整編資料截止日).
  - For articles amended but not yet in force the page shows only the amended wording (recorded as prospective); the wording still in force is on the old-version page (LawOldVer.aspx), which robots.txt disallows.
  - Amendment history (沿革) and original promulgation dates of amended laws are on LawHistory.aspx, which robots.txt disallows; not ingested.
  - Official English translations (/ENG/ pages, API /api/en/...) are disallowed by robots.txt and not ingested; the Chinese text prevails over them in any case.
  - Article attachments (附件) are separate files and are not ingested.
status: active
connector: moj_laws
parser: moj_law_html
