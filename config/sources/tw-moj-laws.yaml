    trademarks or agency logos); personal data remain subject to the Personal Data Protection Act;
    moral rights of third parties are respected; data may not be maliciously altered; the
    declaration does not imply endorsement. OGDL 1.0 (https://data.gov.tw/license), s 2: use for
    any purpose, including commercial, reproduction, distribution, public transmission, editing
    and adaptation; s 3(2): attribution in the form of the annex (顯名聲明), failing which the
    licence is deemed never granted; s 4(2): compatible with CC BY 4.0.
  reviewed_on: 2026-10-14
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: allowed
  attribution_required: true
  attribution_text: >-
    法務部 2026 全國法規資料庫（https://law.moj.gov.tw/）。此開放資料依政府資料開放授權條款 (Open Government
    Data License) 進行公眾釋出，使用者於遵守本條款各項規定之前提下，得利用之。政府資料開放授權條款：https://data.gov.tw/license
    （ULIS 為結構化及索引加工，非法務部之認可。Source: Ministry of Justice, Laws & Regulations Database,
    Open Government Data License v1.0; structured and indexed by ULIS, not endorsed by the Ministry.）
  conditions:
    - Attribution in the form of the OGDL annex (顯名聲明) on every result; without it the licence is deemed never granted (OGDL s 3(2)).
    - Do not alter the data maliciously; ULIS keeps the raw pages unchanged and re-derives every text from them (declaration item 4).
    - Do not suggest endorsement by the Ministry of Justice (declaration item 5; OGDL s 6(1)).
    - Do not represent the text as the authentic law - the site states that the published text of the competent authority prevails (footer).
