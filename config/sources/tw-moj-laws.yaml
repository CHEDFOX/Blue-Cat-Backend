# Pages read for this review (2026-10-14), before any law text was fetched:
#   https://law.moj.gov.tw/robots.txt              - "User-agent: *", "Disallow: /", then
#       "Allow: /News/NewsDetail.aspx", "Allow: /LawClass/LawAll.aspx", "Allow: /SearchEngineSitemap.aspx";
#       no Crawl-delay. Only the law full-text page is fetched by ULIS.
#   https://law.moj.gov.tw/Service/Copyright.aspx  - 政府網站資料開放宣告 (open data declaration)
#   https://data.gov.tw/license                    - 政府資料開放授權條款－第1版 (Open Government Data License 1.0)
#   https://law.moj.gov.tw/api/swagger/index.html and /api/swagger/docs/v1 - Open API (bulk ZIP downloads only)
#   https://law.moj.gov.tw/Index.aspx              - site footer (cut-off date, update frequency, disclaimer)
#   https://law.moj.gov.tw/SearchEngineSitemap.aspx - the sitemap robots.txt names and allows (read 2026-10-15,
#       once, by scripts/build_moj_manifest.py): 17,131 URLs = 11,812 LawClass/LawAll.aspx?pcode= pages (one per
#       law or regulation, repealed ones included) + 5,319 News/NewsDetail.aspx pages (not read).
# The licence and API pages are themselves under robots.txt "Disallow: /"; each was read once, by
# hand, for this review only (no crawling).
schema_version: 1
id: tw-moj-laws
name: 全國法規資料庫 (Laws & Regulations Database of the Republic of China (Taiwan))
publisher: Ministry of Justice (法務部), 全國法規資料庫工作小組
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [TW]
document_kinds: [constitution, act, regulation]
languages: [zh-Hant]
coverage: >-
  The central government's laws (法律) and orders (命令), judicial interpretations, treaties and
  cross-strait agreements, as consolidated by the Ministry of Justice (current text, with
  history pages and English translations of selected laws). ULIS ingests, in Chinese, every law
  and regulation that the sitemap robots.txt allows lists (11,812 PCodes on 2026-10-15), from each
  one's full-text page (所有條文), the one law path robots.txt allows. Repealed laws (廢止, about a
  third of the pages) and pages that carry no article text (charts published as attachments) are
  fetched to find that out and then skipped.
access:
  method: permitted_web_retrieval
  endpoint: config/manifests/tw-moj-laws.yaml
update_frequency: >-
  Weekly. Site footer: 全國法規資料庫之內容每週五定期更新，當週發布之法律、命令資料，將於完成法規整編作業後，於下週五更新上線
  (updated every Friday; laws and orders issued in a week go online the following Friday after
  consolidation). Each page states 法規整編資料截止日 (consolidation cut-off date), 2026-10-02 on 2026-10-14.
rate_limits: >-
  No published numeric limit. robots.txt sets no Crawl-delay, so the ULIS default of one request
  every 5 seconds applies; the connector re-checks robots.txt and fetches only
  /LawClass/LawAll.aspx (one request per law: 11,812, about 16.5 hours at 5 seconds, about 0.65 GB of
  HTML), after one request for the sitemap /SearchEngineSitemap.aspx (also allowed, and named in
  robots.txt). The Open API (/api/ch/law/json, one ZIP of every law) is under robots.txt
  "Disallow: /" and is not used. A refusal (401, 403, 429, 451) stops the run.
