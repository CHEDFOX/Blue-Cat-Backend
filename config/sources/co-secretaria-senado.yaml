# Colombian legislation (Secretaría del Senado "Leyes desde 1992", and the other official compilations). PLANNED, nothing
# ingested: the Senate host dropped ULIS's requests and the two alternative official hosts present certificates Python
# cannot verify. Checked 2026-10-14, one request each, no retry, no other client identity, no proxy, mirror or disabled
# certificate verification (the rules for this project forbid working around a block):
#   https://www.secretariasenado.gov.co/robots.txt                           - "Connection reset by peer" (TLS connection closed by the host);
#        the same for https://www.secretariasenado.gov.co/senado/basedoc/codigo_civil.html (the Código Civil as one HTML page).
#   https://www.funcionpublica.gov.co/robots.txt (Gestor Normativo, Función Pública)  - TLS verification failed: "unable to get
#        local issuer certificate" (the server does not send its intermediate certificate).
#   https://www.suin-juriscol.gov.co/robots.txt (SUIN-Juriscol, Ministerio de Justicia) - the same TLS verification failure.
# A person should re-check from an ordinary network. If one host answers, read its terms and robots.txt first; the two
# hosts with the incomplete certificate chain could be reached with a connector that supplies the missing intermediate
# certificate to PoliteHttp's ssl_context (verification stays on), but only after their terms are read.
