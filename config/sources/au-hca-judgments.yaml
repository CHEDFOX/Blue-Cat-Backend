jurisdictions: [AU]
document_kinds: [judgment]
languages: [en]
coverage: >-
  Judgments of the High Court of Australia (hcourt.gov.au) and of the Federal Court of Australia
  (fedcourt.gov.au / judgments.fedcourt.gov.au). Nothing is ingested.
access:
  method: permitted_web_retrieval
  endpoint: https://www.hcourt.gov.au/cases-and-judgments/judgments
update_frequency: on delivery
rate_limits: Not readable (the servers refuse the bot before any page is served).
licence:
  id: AU-HCA-unknown
  name: Terms of the High Court of Australia website (not read - connection refused)
  review_status: pending_review
  reviewed_on: 2026-10-14
  redistribution: unknown
  bulk_download: unknown
  automated_processing: unknown
  commercial_use: unknown
  notes: >-
    Access is refused at the network level (High Court) or by a bot challenge (Federal Court, AustLII), so no terms or
    robots.txt could be read. Judgments of Australian courts are in practice widely reproduced, but ULIS records no
    permission it has not read. To proceed: ask the High Court Registry and the Federal Court (Registry / Digital Law
    Library) in writing for a permitted channel for an identified research bot.
provenance: Official court websites. Not retrieved.
known_limitations:
  - Not ingested - connection refused (High Court) and Cloudflare challenges (Federal Court, AustLII) on 2026-10-14; no Australian case law in ULIS.
  - Terms and robots.txt of all four hosts unreadable.
status: planned
