# PLANNED - NOT INGESTED. The High Court of Australia's web server closes the connection on every request of the ULIS
# research bot, so neither robots.txt nor the terms could be read. Checked on 2026-10-14 (docs/jurisdictions/court-decisions-survey.md):
#   https://www.hcourt.gov.au/robots.txt - three attempts (HTTP/2, HTTP/2, then HTTP/1.1, identified User-Agent): no HTTP
#        response; "HTTP/2 stream 1 was not closed cleanly: INTERNAL_ERROR" and "Empty reply from server". The behaviour of an
#        edge filter that drops non-browser clients; nothing was changed to get past it (no other agent, no proxy, no browser).
#   https://eresources.hcourt.gov.au/robots.txt - 301 to https://www.hcourt.gov.au/cases-and-judgments/judgments (same host).
#   Federal Court of Australia: https://www.fedcourt.gov.au/robots.txt answered 403 with the Cloudflare "Just a moment..."
#        challenge page; https://www.judgments.fedcourt.gov.au/robots.txt - connection reset by peer.
#   AustLII: https://www.austlii.edu.au/robots.txt and https://classic.austlii.edu.au/robots.txt both answered 403 with the
#        same Cloudflare challenge (so its robots.txt and terms are unreadable to a bot; AustLII's refusal of automated
#        access is known from its published usage policy but was not read here).
#   The High Court's own terms (copyright notice) were therefore not read; nothing about reuse is assumed.
schema_version: 1
id: au-hca-judgments
name: High Court of Australia judgments (hcourt.gov.au) and Federal Court of Australia judgments
publisher: High Court of Australia; Federal Court of Australia
kind: official_court_database
