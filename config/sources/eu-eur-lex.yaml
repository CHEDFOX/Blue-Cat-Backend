# EU law from the Publications Office of the European Union (EUR-Lex / Cellar).
# Licence and access reviewed 2026-10-14; see docs/jurisdictions/eu.md for the evidence.
schema_version: 1
id: eu-eur-lex
name: EUR-Lex / Cellar (Publications Office of the European Union)
publisher: Publications Office of the European Union
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [EU]
document_kinds: [founding_treaty, charter, regulation, directive, decision]
languages: [bg, cs, da, de, el, en, es, et, fi, fr, ga, hr, hu, it, lt, lv, mt, nl, pl, pt, ro, sk, sl, sv]
coverage: >-
  EU law in all 24 official languages: the Official Journal, consolidated texts, case law and
  their metadata, held in Cellar (the repository behind EUR-Lex). ULIS ingests every regulation, directive and decision
  in force (cdm:resource_legal_in-force) that Cellar holds as Formex 4 in English - 26,875 acts on 2026-10-15,
  including implementing and delegated acts - plus the Charter of Fundamental Rights (OJ C 202, 2016) and the 2016
  consolidated versions of the TEU and TFEU (XHTML; protocols, annexes and declarations excluded). For the 2,864 acts that
  have a consolidated version (the Publications Office's text with the amendments applied, distributed as Formex 4 like the
  Official Journal) the latest version applying today is ingested instead of the act as adopted; the other 24,011 are
  ingested as adopted, with the Publications Office metadata on dates, amendments and corrigenda. English only for the
  bulk; the Treaties, the Charter and five core acts (GDPR, Rome I, Brussels Ia, Consumer Rights Directive, AI Act) in
  English, French and German. The list is generated from Cellar's SPARQL endpoint (scripts/build_eu_manifest.py).
access:
  method: api
  endpoint: config/manifests/eu-eur-lex.yaml
update_frequency: daily (Official Journal); re-fetch to refresh
rate_limits: >-
  No published rate limit found. publications.europa.eu/robots.txt redirects to
  https://op.europa.eu/robots.txt ("User-agent: *", "Allow: /", no Crawl-delay; /resource/ and
  /webapi/ are not disallowed; read 2026-10-14 and 2026-10-15). ULIS waits at least 5 s between requests and caches every
  response. The manifest generator makes about 150 SPARQL requests (two per year of the act, 1952-2026); a full ingest
  makes 30,926 requests at 5 s (about 43 h): three batched SPARQL queries per 20 works and one request per file (an act is one
  to a few files, the Treaties and core acts three languages). eur-lex.europa.eu itself answered automated requests (even robots.txt)
  with an AWS WAF challenge (HTTP 202, x-amzn-waf-action: challenge) on 2026-10-14; ULIS does not use it.
licence:
  id: EU-REUSE-2011-833
  name: Commission reuse notice - Commission Decision 2011/833/EU of 12 December 2011 on the reuse of Commission documents
  url: http://data.europa.eu/eli/dec/2011/833/oj
  review_status: approved
  reviewed_by: >-
    ULIS project, from the publisher's own pages (2026-10-14): (1) the Publications Office's
    dataset "Sparql and RESTful API access to European Union law and publications (CELLAR)" on
    the official EU data portal (https://data.europa.eu/data/datasets/sparql-cellar-of-the-publications-office)
    describes the service ULIS uses ("Key collections of EU information - legal content and
    general publications - can be fetched directly from ... the CELLAR, using the
    machine-readable SPARQL endpoint facility or the HTTP RESTful web services") and gives
    every distribution the licence "European Commission reuse notice"
    (http://data.europa.eu/eli/dec/2011/833/oj); (2) Decision 2011/833/EU (read from Cellar,
    OJ L 330, 14.12.2011, p. 39), arts 4 and 6: documents are available for reuse for commercial
    or non-commercial purposes, without charge and without individual application, subject to
    acknowledging the source, not distorting the original meaning and non-liability of the
    Commission; (3) the Cellar "Users" page (https://op.europa.eu/en/web/cellar/users) names
    data re-users (academic and research institutions, publishers ...) who "can search and
    retrieve publications and their associated metadata directly from Cellar"; (4) the
    Publications Office copyright notice
    (https://op.europa.eu/en/web/about-us/legal-notices/publications-office-of-the-european-union-copyright)
    refers reuse of EUR-Lex content to the EUR-Lex notice and names op-copyright@publications.europa.eu
    for questions on Cellar reuse; (5) the data.europa.eu copyright notice
    (https://data.europa.eu/en/copyright-notice) restates the Commission reuse policy.
  reviewed_on: 2026-10-14
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: allowed_with_conditions
  attribution_required: true
  attribution_text: "Source: EUR-Lex / Cellar, Publications Office of the European Union (https://eur-lex.europa.eu). © European Union."
  conditions:
    - Acknowledge the source (Decision 2011/833/EU, art 6(2)(a)).
    - Do not distort the original meaning or message of the documents (art 6(2)(b)); ULIS stores the exact text and never edits it.
    - The Commission is not liable for any consequence of the reuse (art 6(2)(c)).
    - Only the Official Journal published in electronic form is authentic (Regulation (EU) No 216/2013, art 1(2), from 1 July 2013; before that the printed OJ); ULIS never presents its copies as authentic.
    - Content subject to third-party rights is outside the reuse policy (Decision 2011/833/EU, art 2(2)(b)).
  notes: >-
    Not read: the EUR-Lex legal notice (https://eur-lex.europa.eu/content/legal-notice/legal-notice.html),
    because eur-lex.europa.eu answers automated clients with a bot challenge. A person should
    confirm it in a browser. Decision 2011/833/EU covers Commission documents and documents the
    Publications Office publishes on its behalf; acts of the Parliament and the Council, the
    Treaties and case law are reused here on the strength of the publisher's licence statement
    for the Cellar dataset. The Court of Justice's own notice (https://curia.europa.eu/site/jcms/d2_5167/en/copyright)
    allows case law to be reproduced with acknowledgement; no case law is ingested yet.
    Counsel review recommended before production use.
provenance: >-
  Cellar, publications.europa.eu: the SPARQL endpoint (https://publications.europa.eu/webapi/rdf/sparql)
  for metadata and the RESTful item URLs (https://publications.europa.eu/resource/cellar/...)
  for the files. Each language version of a work is stored as one bundle holding every response
  used, exactly as received, with its URL, retrieval time and SHA-256 (images in annexes are
  listed but not kept).
known_limitations:
  - Formex 4 and XHTML files are the publisher's renditions of the Official Journal (and of the consolidated texts), not the authentic (signed) electronic edition.
  - An act without a consolidated version is ingested as adopted; later amendments and corrigenda are reported from the metadata but not applied. Where the metadata locates a replacement, deletion or insertion, the original wording of that provision is ended on the amendment's start of validity, and the later wording is not indexed.
  - A consolidated version is documentation produced by the Publications Office (not authentic) and a whole-instrument snapshot; it gives no date for individual provisions, so a provision starts on the version's START.DATE (an unamended article is older than that). Only the latest version applying today is ingested (not the earlier dated versions, about 6.5 times as many documents; widen with scripts/build_eu_manifest.py --all-consolidated-versions).
  - The TEU and TFEU are the 2016 consolidated versions (documentation); when each wording took effect is not recorded.
  - Partial application dates are recorded in notes; which provisions they concern is not modelled.
  - Recitals, citations, final formulas and signatures are not indexed.
  - About 8,200 of the 35,085 acts in force (regulations, directives, decisions) have no English Formex 4 file in Cellar (older acts: PDF/HTML scans) and are not ingested; nor are acts of sectors other than 3, international agreements, or acts before 1952.
  - English only except the Treaties, the Charter and five core acts (French and German); the other 21 official languages are not ingested.
status: active
connector: eu_cellar
parser: eu_cellar
