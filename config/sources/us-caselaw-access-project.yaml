# PLANNED - NOT INGESTED. The data is licensed CC0, but the host that serves it (static.case.law) publishes a
# robots.txt that disallows every path for every robot, so ULIS fetched no case. Checked on 2026-10-14
# (details in docs/jurisdictions/us-case-law.md):
#   https://static.case.law/robots.txt - "User-agent: *" / "Disallow: /" (the whole host, including
#        ReportersMetadata.json and every reporter, volume and case file). Kept in
#        tests/fixtures/caselaw_access_project/static.case.law.robots.txt.
#   https://case.law/robots.txt - "User-agent: *" / "Disallow: /caselaw/" / "Sitemap: /sitemap.txt" (the project
#        website; its /terms/ and /about/ pages are not disallowed). Kept in the same fixture directory.
#   https://case.law/terms/ - "Terms of Use", "Effective: March 13, 2024". The page is rendered by JavaScript, so its
#        text was read from the page's own script https://case.law/templates/cap-terms-page.js. Section "License to
#        Caselaw Data and Metadata": "Harvard makes the caselaw data and metadata on this site (the "Caselaw Data")
#        available for public use under the CC0 1.0 Public Domain Designation" and links the Caselaw Data at
#        https://static.case.law/; "The CC0 1.0 Universal license expressly disclaims any warranties. The data is
#        provided "as is" and Harvard makes no representations or warranties of any kind concerning the status of
#        any data included in the Caselaw Data that is generated by third parties." "Although Harvard does not
#        impose any legally binding conditions on access to the Metadata, Harvard requests that you act in accordance
#        with the following Community Norms": (1) attribution to Harvard University and the Caselaw Access Project
#        "to the extent it is technologically feasible to do so" (https://case.law/about/#data-citation), and (2) to
#        make the Caselaw Data and any improvements freely available on the same terms. Site text is CC BY-SA 4.0,
#        site source code MIT (neither is data).
#   Request history: two requests to static.case.law, both on 2026-10-14. robots.txt, and - in the same batch,
#        before its content had been read - ReportersMetadata.json (the reporter index). The latter was a lapse in
#        ordering: the file was discarded and nothing from it is recorded or used anywhere in ULIS. No case, volume
#        or reporter file was requested. Six requests to case.law (robots.txt, /, /sitemap.txt, /terms/, /about/ and the
#        terms script), none to a disallowed path.
#   The layout of the static site (ReportersMetadata.json, per-reporter and per-volume metadata, one JSON file per
#        case with name, citations, court, jurisdiction, decision_date and casebody) is as described in the
#        request for this source; it was NOT examined here, so no parser exists and no field mapping is claimed.
# RE-TESTED 2026-10-16 (market sweep, one request each; fixtures in tests/fixtures/us_case_law_sources/retest-2026-10-16/):
#   https://static.case.law/robots.txt - still "User-agent: *" / "Disallow: /" (27 bytes): the data host still refuses every robot, so the
#        reason for `planned` holds and nothing was requested from it. https://case.law/robots.txt unchanged ("Disallow: /caselaw/").
#   https://lil.law.harvard.edu/blog/2024/03/26/transitions-for-the-caselaw-access-project (Harvard LIL; its robots.txt: Crawl-delay 10):
#        "the original limitations on the data available for the Caselaw Access Project expired this month, and that data can now be
#        fully released without restriction on access or use"; "The Free Law Project already includes all CAP cases, as well as cases
#        scraped from court websites, in its CourtListener search engine." So the CAP corpus is loaded through the publisher-licensed
#        route us-courtlistener-bulk-s3 (column opinions.xml_harvard, and filepath_json_harvard names the CAP file of each case), not from
#        this host; this record stays planned because its own host refuses robots, and no mirror is used.
schema_version: 1
id: us-caselaw-access-project
name: Caselaw Access Project (static data), Harvard Library Innovation Lab
publisher: >-
  President and Fellows of Harvard College (Caselaw Access Project, Harvard Law School Library Innovation Lab).
  Not an official court publication: a digitisation of the Harvard Law School Library's collection of printed
  case reports.
kind: open_data_repository
authority: unofficial
jurisdictions: [US]
document_kinds: [judgment]
languages: [en]
coverage: >-
  Published United States case law from federal and state reporters (the request for this source names the
  United States Reports and the federal appellate reporters as the targets). Nothing is ingested; the extent of the corpus was
  not examined because the data host disallows robots.
access:
  method: bulk_download
  endpoint: https://static.case.law/
update_frequency: not examined
rate_limits: >-
  robots.txt of static.case.law (2026-10-14): "User-agent: *" / "Disallow: /". Automated retrieval by ULIS is
  therefore not permitted, whatever the licence of the data. The terms page states no rate limit.
licence:
  id: CC0-1.0
  name: CC0 1.0 Universal (Public Domain Designation) for the Caselaw Data, per the CAP Terms of Use of 2024-03-13
  url: https://case.law/terms/
  review_status: pending_review
  reviewed_by: >-
    ULIS project - CAP Terms of Use (https://case.law/terms/, effective March 13, 2024, read from
    https://case.law/templates/cap-terms-page.js) and the robots.txt files of static.case.law and case.law.
  reviewed_on: 2026-10-14
  redistribution: allowed
  bulk_download: not_allowed
  automated_processing: allowed
  commercial_use: allowed
  attribution_required: false
  attribution_text: >-
    Caselaw Access Project, Harvard Law School Library Innovation Lab (https://case.law/), data marked CC0 1.0
    Universal. (Attribution is a Community Norm requested by the publisher, not a legal condition; the wording is
    ULIS's. https://case.law/about/#data-citation was not read.)
  conditions:
    - Automated retrieval from static.case.law only if its robots.txt admits the ULIS research bot or the publisher gives written permission. The "not_allowed" for bulk_download records that access policy, not the CC0 licence of the data.
    - Community Norms (requested, not binding) - attribute Harvard University and the Caselaw Access Project; offer the data and improvements on the same open terms.
  notes: >-
    The licence is clear (CC0 for the Caselaw Data, "as is", no warranty about third-party content), but the data
    host disallows every robot. ULIS respects robots.txt and works around no refusal (no other user agent, no
    mirror, no browser automation), so the source stays planned. Third-party mirrors of the same data set were not
    consulted and are not used. To proceed: written permission from the Library Innovation Lab for an identified
    research bot, or a robots.txt on static.case.law that admits it. The /about/ page (data citation,
    format documentation) was fetched but is rendered by JavaScript; its script was not read.
provenance: >-
  Harvard Law School Library's scanned reporters, converted to structured JSON by the Caselaw Access Project.
  Not retrieved. The authoritative text of United States Reports opinions is the Court's bound volumes; this data set
  is a copy of them.
known_limitations:
  - Not ingested from this host - its robots.txt disallows automated access (2026-10-14, re-tested 2026-10-16); the same cases arrive through us-courtlistener-bulk-s3 (the Harvard text is its xml_harvard column).
  - Layout, field names and extent of the data set were not examined, so nothing about the content is verified.
  - Unofficial digitisation, so the text is not the Court's official reporter text; OCR errors would be possible.
  - Judicial treatment (overruled, distinguished, followed) is not part of this data set as described and would never be inferred by ULIS.
status: planned
connector: null
parser: null
