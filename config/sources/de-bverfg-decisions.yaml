# PLANNED - NOT INGESTED. The Federal Constitutional Court's own site is open to robots for its decisions, but the legal
# notice (terms) lies in a disallowed path, the decision search too, and the sitemap lists no decisions. Read on 2026-10-14:
#   https://www.bundesverfassungsgericht.de/robots.txt - "User-agent: *" / "Disallow: /SiteGlobals/" / "Disallow: /DE/Service/" /
#        "Disallow: /EN/Service/" / "Crawl-delay: 30" / sitemap https://www.bundesverfassungsgericht.de/Sitemap_Index.xml. The
#        Impressum and "Rechtliche Hinweise" pages (/DE/Service/Impressum/...) are therefore not for robots, and the decision
#        search (/SiteGlobals/...) is disallowed.
#   https://www.bundesverfassungsgericht.de/Sitemap_Basepage.xml (the only sitemap; 243 URLs): no individual decision pages.
#   https://www.bundesgerichtshof.de/robots.txt: the same pattern (Crawl-delay 30); https://www.bverwg.de/robots.txt: "Allow: /"
#        for "User-agent: *" (Crawl-delay 30) but it disallows the year paths /2012/ ... /2025/ (and /suche); not examined further.
#   The reuse terms of the courts' sites are known only second-hand (see de-rechtsprechung-im-internet: the federal courts
#        publish "zur nicht gewerblichen Nutzung", per the European e-Justice Portal); decisions are free of copyright under
#        § 5 Abs. 1 UrhG. Nothing was fetched beyond robots.txt and the sitemaps.
