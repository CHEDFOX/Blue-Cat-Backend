schema_version: 1
id: es-boe-consolidada
name: Legislación consolidada (BOE)
publisher: Agencia Estatal Boletín Oficial del Estado (AEBOE)
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions: [ES]
document_kinds:
  - constitution
  - organic_law
  - law
  - royal_legislative_decree
  - royal_decree_law
  - decree_law
  - royal_decree
  - decree
  - regulation
  - ministerial_order
  - resolution
  - instruction
  - circular
  - agreement
  - international_agreement
languages: [es]
coverage: >-
  Consolidated texts of the norms of the Spanish legal order prepared by the AEBOE's documentation services, with
  every intermediate version since the original publication, served by the BOE open-data API
  (https://www.boe.es/datosabiertos/api/legislacion-consolidada). ULIS ingests every State (ambito "Estatal") norm
  of the API's list that is not repealed or spent in full - 6,826 on 2026-10-18: laws, royal decrees, orders,
  resolutions, circulars, instructions, agreements, international agreements and the older decrees - in Castilian
  Spanish with their full version history (see the manifest, generated from the list endpoint). The 1,988 norms marked
  vigencia_agotada = S (repealed or spent in full: not the law in force today) and the 3,620 norms of the autonomous
  communities that the same list holds are not ingested (`--include-spent` on the manifest script adds the former).
access:
  method: api
  endpoint: config/manifests/es-boe-consolidada.yaml
update_frequency: >-
  Continuous. Per the API FAQ, a new consolidated version is prepared 1 to 3 days after a
  modifying norm is published; re-fetch to refresh.
rate_limits: >-
  No rate limit, Crawl-delay, registration, key or notice is published (re-checked 2026-10-18). https://www.boe.es/robots.txt
  (fetched 2026-10-18 10:50 UTC, Last-Modified 02 Oct 2026) has a single "User-agent: *" group, no Crawl-delay, and does not
  disallow /datosabiertos/ (it disallows about 12,300 per-document paths on other parts of the site; the connector reads
  robots.txt afresh on every online run and skips a norm whose API path a rule names: none of the 6,826 does). The API page
  https://www.boe.es/datosabiertos/api/api.php lists only 200/400/404/500, APIconsolidada.pdf (2 September 2025) states no
  rate, and an API response carried no rate-limit or Retry-After header (2026-10-18 10:52 UTC). The reuse conditions ask
  for "una utilización diligente de los contenidos ... [no] contrarias ... a los usos generalmente aceptados" (condición
  Tercera, https://www.boe.es/informacion/aviso_legal/index.php#reutilizacion), read strictly as generally accepted crawler
  practice: one connection, 1 s between request starts (the project minimum; a Crawl-delay in robots.txt would win),
  back-off on 429/5xx honouring Retry-After, any refusal stops the run (condición Quinta lets AEBOE suspend access
  "sin previo aviso"). A full run is 6,827 requests = about 1.9 h at 1 s (about 2.8 h if latency adds; about 6.5 GB),
  against 9.5 h at the earlier 5 s. No bulk file exists. Optional courtesy before the first full run at 1 request/s:
  the webmaster form https://www.boe.es/contactar/formulario_simple.php?tipo=WEB.
licence:
  id: AEBOE-reutilizacion-2024
  name: >-
    Condiciones de reutilización de la Agencia Estatal BOE (licencia tipo aprobada por
    Resolución de 27 de junio de 2024; Ley 37/2007 sobre reutilización de la información del
    sector público)
  url: https://www.boe.es/informacion/aviso_legal/index.php#reutilizacion
  review_status: approved
  reviewed_by: >-
    ULIS project, from the publisher's own pages (read 2026-10-14): the aviso legal
    (https://www.boe.es/informacion/aviso_legal/index.php#reutilizacion) "permiten la
    reutilización de los documentos ... para fines comerciales y no comerciales", including
    "copia, reproducción, distribución" and "modificación, adaptación, extracción, reordenación y
    combinación ... en orden a crear obras derivadas o productos o servicios de valor añadido";
    the open-data page (https://www.boe.es/datosabiertos/) offers the API "para facilitar el
    acceso, la descarga y la reutilización"; the API FAQ
    (https://www.boe.es/datosabiertos/faq/consolidada.php) restates that consolidated texts must
    be marked as merely informative.
  reviewed_on: 2026-10-14
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: allowed_with_conditions
  attribution_required: true
  attribution_text: >-
    Basado en datos de la Agencia Estatal Boletín Oficial del Estado (https://www.boe.es). Texto
    consolidado de carácter meramente informativo: solo la publicación en el diario oficial
    «Boletín Oficial del Estado» es oficial y auténtica.
  conditions:
    - >-
      Cite the source with a link to https://www.boe.es; for derived products: "Basado en datos
      de la Agencia Estatal Boletín Oficial del Estado" (attribution_text, returned with every
      result).
    - >-
      Do not suggest the information is official: every reused consolidated text must state that
      it is a consolidated text of merely informative character (attribution_text; REVISED_TEXT
      and SOURCE_NOT_AUTHENTIC limitations).
    - >-
      Mention the date of the last update where the document gives it (fecha_actualizacion,
      returned as the currency date) and keep the update-date metadata (stored in the raw
      document).
    - Do not distort the meaning of the information; identify modifications or adaptations as such.
    - Do not state or imply that the AEBOE takes part in, sponsors or supports the reuse.
    - >-
      Personal data, if any, only in accordance with Regulation (EU) 2016/679 and Ley Orgánica
      3/2018.
    - >-
      Not reusable: the portal's design, domains, trademarks and logos, and elements whose
      intellectual property belongs to third parties; Biblioteca Jurídica Digital works are under
      CC BY-NC-ND 4.0 and are not used.
  notes: >-
    Use is at the reuser's own risk; the AEBOE may deny or suspend access to anyone breaching the
    conditions; Spanish law and the courts of Madrid apply. Counsel review still recommended
    before production use.
provenance: >-
  Official publisher of the BOE (Agencia Estatal Boletín Oficial del Estado). Its aviso legal
  states that only the texts published in the electronic edition of the diario oficial "Boletín
  Oficial del Estado" are official and authentic; the API FAQ states that consolidation
  integrates express amendments "en un solo texto, sin valor oficial" and that consolidated texts
  "tienen carácter meramente informativo. Para fines jurídicos debe consultarse la publicación
  oficial."
known_limitations:
  - Consolidated texts are informative, not official; only the BOE publication is authentic.
  - Only express amendments and repeals are consolidated; tacit repeals and other effects that need interpretation are not reflected (API FAQ).
  - Co-official languages (Catalan, Galician, Basque/Euskera) and translations are not fetched.
  - Regional (autonomous community) legislation, also consolidated by the AEBOE, is not ingested (3,620 norms in the list; ULIS has no profile for the communities).
  - A norm repealed or annulled in full ends on the date its metadata give (fecha_derogacion, fecha_anulacion); a norm marked vigencia_agotada without such a date (a spent measure) is stored with the flag and no end date.
  - The API lists norms by their last update; the manifest is a snapshot of the list (regenerate with scripts/build_boe_manifest.py to refresh).
status: active
connector: boe_consolidada
parser: boe_consolidada_xml
