# Basiswettenbestand (BWB): consolidated Dutch national legislation (KOOP). Terms and access rules
# read on 2026-10-14 from the publisher's own pages (cached under var/sources/):
#   https://data.overheid.nl/dataset/basis-wetten-bestand - dataset "Basis Wetten Bestand", data owner KOOP (Kennis- en
#        Exploitatiecentrum voor Officiële Overheidspublicaties) (Rijk), "Licentie: CC-0 (1.0)", "Toegang: Publiek";
#        "Alle regelingen uit het basiswettenbestand zijn als open data beschikbaar in XML-formaat. Deze kunnen gedownload
#        worden over HTTPS vanaf de repository. Daardoor is het mogelijk om een eigen kopie van het basiswettenbestand
#        op te bouwen." Downloads (toestand, WTI, manifest schemas) and the SRU handleiding are each listed as CC-0 (1.0).
#   https://www.overheid.nl/help/wet-en-regelgeving/een-eigen-kopie-van-het-basiswettenbestand-opbouwen - the
#        collection (about 45,000 regelingen, more than 100,000 toestanden), "een bestand met de wetstechnische
#        informatie, een manifest-bestand"; manifest, WTI and toestand files "kunt u eenvoudig via HTTPS downloaden";
#        schemas toestand_2015-2.xsd, wti_2015-2.xsd and bwb/_manifest.xsd on the repository host.
#   https://data.overheid.nl/sites/default/files/dataset/ab78ba3f-bc07-49cc-95f2-0e23b8653181/resources/Handleiding%2BSRU%2BBWB.pdf
#        - SRU interface (endpoint zoekservice.overheid.nl/sru/Search, x-connection=BWB) and response fields
#        (geldigheidsperiode, zichtperiode, locatie_toestand / _wti / _manifest on the repository).
#   https://www.overheid.nl/help/wet-en-regelgeving/bijzonderheden-consolidatie - "De geconsolideerde teksten zijn geen
#        officiële teksten in de zin van de Grondwet. Alleen publicaties in het Staatsblad, de Staatscourant en andere
#        van overheidswege verkrijgbaar gestelde publicatiebladen hebben een officieel karakter."; retroactive effect
#        ("terugwerkende kracht") is information in the WTI and marked in the text.
#   https://www.overheid.nl/help/wet-en-regelgeving/inhoud-actualiteit-volledigheid-en-betrouwbaarheid - Acts and AMvBs
#        from 1 May 2002; at least 95% of decisions processed within two working days of publication; errors occur
#        ("A-fouten"); "De informatie in Wet- en regelgeving vormt geen bekendmaking in de zin van de Grondwet."
#   https://repository.officiele-overheidspublicaties.nl/uitleg_service_officielepublicaties.html ("/bwb/" redirects
#        to it) - the repository service: levels area / work / expression / manifestation / item, with ?output=xml|html|zip;
#        it offers no list of the works. The base set of the whole collection (about 160 GB, 14 GB zipped) is given out
#        on request through KOOP's contact form once a month (data.overheid.nl dataset page): not obtainable by ULIS.
#   robots.txt (read first): repository.officiele-overheidspublicaties.nl/robots.txt -> 404 (none published);
#        zoekservice.overheid.nl/robots.txt -> "User-agent: * / Disallow: /" (the SRU service is therefore NOT used);
#        wetten.overheid.nl/robots.txt -> "Sitemap: https://wetten.overheid.nl/sitemap.xml"; the catch-all (User-agent: *)
#        allows everything except search results, /*/informatie/xml, /*/download/1$, /*afdrukken$ and /service/; named AI/LLM
#        crawlers (GPTBot, ClaudeBot, anthropic-ai, CCBot, "rag-kennisbank", ...) are disallowed entirely; "AstralLaw" and
#        "45weg-legal-research" (legal research) are allowed with Crawl-delay 30. ULIS reads that one sitemap file (about
#        47,000 addresses of regulations, 7 MB) with its own identifying User-Agent and a 30 s delay, to learn the BWB
#        identifiers; it fetches no page of the website. www.overheid.nl and data.overheid.nl (Crawl-delay 10) allow the help
#        and dataset pages read here for the catch-all user agent; both also disallow ClaudeBot and other AI crawlers.
#   Auteurswet art. 11 (BWBR0001886, toestand 2026-01-01_0, fetched from the repository): "Er bestaat geen
#        auteursrecht op wetten, besluiten en verordeningen, door de openbare macht uitgevaardigd, noch op rechterlijke
#        uitspraken en administratieve beslissingen."
schema_version: 1
id: nl-bwb
name: Basiswettenbestand (wetten.overheid.nl)
publisher: >-
  KOOP - Kennis- en Exploitatiecentrum voor Officiële Overheidspublicaties (Ministerie van
  Binnenlandse Zaken en Koninkrijksrelaties); open-data repository
  repository.officiele-overheidspublicaties.nl
kind: open_data_repository
authority: official_non_authentic
jurisdictions: [NL]
document_kinds: [constitution, act]
languages: [nl]
coverage: >-
  Consolidated texts of Dutch national regulations (Acts and AMvBs from 1 May 2002, ministerial
  regulations from 1 May 2003, and other categories), each as a series of toestanden
  (consolidated versions with validity periods), plus per-regulation manifest and wetstechnische
  informatie (WTI) files. The manifest lists the 43,430 regulations (BWBR identifiers) of the
  publisher's sitemap: the current toestand of each, and the full series of toestanden for two (the
  Grondwet and the Uitvoeringswet AVG). ULIS keeps wetten, AMvB's and ministeriele regelingen in
  force; lapsed regulations, other kinds (beleidsregel, zbo, KB, the BES variants) and the 3,704
  treaties (BWBV) are not ingested.
access:
  method: bulk_download
  endpoint: config/manifests/nl-bwb.yaml
update_frequency: daily ("Dagelijks wordt het basiswettenbestand bijgewerkt"); re-fetch a regulation's manifest.xml to refresh
rate_limits: >-
  No published rate limit and no robots.txt on the repository host. ULIS waits 5 s between
  requests, identifies itself and caches every download. The SRU service (zoekservice.overheid.nl)
  is not used because its robots.txt disallows all robots. The whole manifest is 43,430 regulations: one request
  for each manifest and one for the current toestand of the 41% that are in force (a lapsed regulation costs one
  request): about 61,000 requests, 85 hours at 5 s (random sample of 319: 58% lapsed, 31% a wet, AMvB or ministeriele
  regeling in force, 9% another kind, 1% not yet in force).
licence:
  id: CC0-1.0
  name: >-
    Creative Commons CC0 1.0 (public domain dedication), as stated for the BWB dataset and its
    downloads on data.overheid.nl; Acts are not protected by copyright (art. 11 Auteurswet)
  url: https://data.overheid.nl/dataset/basis-wetten-bestand
  review_status: approved
  reviewed_by: >-
    ULIS project - the dataset page on data.overheid.nl (data owner KOOP) states "Licentie: CC-0
    (1.0)" for the dataset and each of its downloads, and that all BWB regulations are available as
    open data in XML for download over HTTPS from the repository, to build one's own copy; art. 11
    Auteurswet excludes copyright in Acts and other regulations. The repository host publishes no
    robots.txt; the SRU host's robots.txt (Disallow: /) is respected by not using it.
  reviewed_on: 2026-10-14
  redistribution: allowed
  bulk_download: allowed_with_conditions
  automated_processing: allowed
  commercial_use: allowed
  attribution_required: false
  attribution_text: >-
    Bron: Basiswettenbestand (wetten.overheid.nl), KOOP; open data CC0 1.0. Geconsolideerde tekst,
    geen officiële bekendmaking: alleen de publicatie in het Staatsblad of de Staatscourant is officieel.
  conditions:
    - Do not present the consolidated text as official; the Staatsblad / Staatscourant publication is authentic (stated on every result).
    - Polite retrieval from the repository only (identifying User-Agent, 5 s between requests, cached downloads); stop on any refusal.
    - Do not use the SRU service (zoekservice.overheid.nl disallows all robots) and do not crawl the pages of wetten.overheid.nl; the one file read from that host is the sitemap that its robots.txt declares.
  notes: >-
    CC0 requires no attribution; ULIS attributes anyway. The KOOP website wetten.overheid.nl and
    the portals overheid.nl / data.overheid.nl disallow named AI/LLM crawlers (including ClaudeBot,
    anthropic-ai and a "rag-kennisbank") in robots.txt. ULIS's own identified research bot is not
    among them; it takes the files from the CC0 open-data repository (the route the dataset page itself
    describes) and one sitemap from the website. The publisher's stated preference against AI
    crawling of its website stays an open question for model training or retrieval-augmented
    generation at scale (docs/licence-review.md); widening from six regulations to the whole collection
    makes it weigh more, and the project cannot obtain KOOP's view. An operator who counts that preference as
    binding should not run this source. Counsel review still recommended before production use.
provenance: >-
  KOOP's open-data repository of the Basiswettenbestand: per regulation a manifest.xml (listing
  every toestand with validity and visibility periods and a SHA-512 hash) and one XML file per
  toestand. Consolidations are made by KOOP from the publications in the Staatsblad and
  Staatscourant (officielebekendmakingen.nl), which alone are official. Each download is stored
  byte-for-byte (SHA-256) with its URL and retrieval time; whether it matches the manifest's
  SHA-512 is recorded.
known_limitations:
  - Not the official text ("geen officiële teksten in de zin van de Grondwet"); the Staatsblad and Staatscourant are authentic and are not ingested.
  - History in the BWB starts on 1 May 2002 for Acts; earlier wordings are not available as toestanden. Only the Grondwet and the Uitvoeringswet AVG are ingested with their full series of toestanden; every other regulation has its current toestand only (from the date it took effect, earlier wordings are not indexed).
  - Dates are per article (element @inwerking); members and list items share their article's date. Retroactive effect is only noted, the version starts on its entry into force.
  - Toestanden corrected later for retroactive effect are replaced by their corrected variant; the superseded variants (other knowledge time) are not ingested.
  - Scheduled toestanden (starting after the manifest was generated) are reported as outstanding changes, not ingested.
  - For older toestanden the manifest's SHA-512 does not match the file served (KOOP regenerated the files with richer metadata); recorded per document, not fatal.
  - Consolidation can lag publication by a few working days, and the publisher reports occasional errors.
  - The list of regulations is the website's sitemap (the repository has no list), so a regulation added after the manifest was made is missing until it is regenerated.
  - Scope is wetten, AMvB's and ministeriele regelingen. Policy rules (beleidsregel), regulations of independent administrative bodies (zbo), royal decrees (KB), the Caribbean Netherlands variants (-BES) and treaties are not ingested; a lapsed regulation is skipped after its manifest has been read.
  - A regulation whose structure the parser does not know is an ingest error and is skipped, together with the change report of its manifest (two errors for one regulation).
status: active
connector: bwb
parser: bwb_xml
