    authority of the Government Printer. Authorised electronic versions are published on this
    website under section 62 of the Interpretation of Legislation Act 1984 for personal use
    only."
  reviewed_on: 2026-10-14
  redistribution: not_allowed
  bulk_download: not_allowed
  automated_processing: not_allowed
  commercial_use: not_allowed
  attribution_required: null
  attribution_text: null
  conditions:
    - >-
        Rejected: the terms limit authorised versions to personal use and reserve copyright; the
        robots.txt also disallows the downloadable documents.
    - >-
        Re-open only if the Office of the Chief Parliamentary Counsel (ocpc@ocpc.vic.gov.au)
        grants reuse in writing.
  notes: >-
    REJECTED, nothing ingested.
provenance: >-
  Official publisher named above. Nothing was downloaded from it for the corpus; the findings in this descriptor come from the pages named under licence.reviewed_by.
