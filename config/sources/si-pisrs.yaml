  url: https://pisrs.si/
  review_status: pending_review
  reviewed_by: 'ULIS project, preliminary research notes - Terms read via the site''s own API (https://pisrs.si/api/navigation/gethtml/493,
    ''Pogoji uporabe'', last changed 18. 9. 2026): use is free; the information is of an informative character (only the electronic
    Uradni list is original); section 8: the user may not ''spreminjati, prepisovati ali drugače reproducirati, ponovno objavljati,
    pošiljati po pošti ali kako drugače uporabljati in razširjati spletišča PISRS kot računalniškega programa, informacijske
    rešitve oziroma podatkovne baze niti v komercialne niti v nekomercialne namene'' (no copying of the site as a database,
    commercial or not). robots.txt: ''Allow: /'', ''Disallow: /iskanje''. An API exists (OpenAPI https://pisrs.si/swagger/PisrsAPI.json,
    base https://pisrs.si/extapi, endpoints /predpis/..., /besedilo/{id}) but every call needs an X-API-Key obtained with
    POST /api-access/request-access (a request by a named user); ULIS did not request a key.'
  reviewed_on: '2026-10-15'
