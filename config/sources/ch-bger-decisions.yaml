# PLANNED - NOT INGESTED. The Federal Supreme Court's web server could not be reached securely: its TLS certificate chain
# is incomplete (the server does not send the intermediate certificate), so certificate verification fails, and ULIS never
# disables verification. Neither robots.txt nor the legal notice could be read. Checked on 2026-10-14
# (docs/jurisdictions/court-decisions-survey.md):
#   https://www.bger.ch/robots.txt and https://bger.ch/robots.txt - "SSL certificate problem: unable to get local issuer
#        certificate" (curl 60) with the project's CA bundle.
#   https://www.bundesgericht.ch/robots.txt - TLS "unrecognized name" (not a served host name).
#   Other Swiss courts looked at: https://www.bvger.ch/robots.txt (Federal Administrative Court) reads "User-agent: *" /
#        "Disallow:" (everything allowed) but its decision database jurispub.admin.ch answered /robots.txt with HTTP 400, and the
#        Federal Criminal Court's bstger.weblaw.ch allows everything except /cache; neither's terms were read or its listing
#        examined, so neither is ingested.
