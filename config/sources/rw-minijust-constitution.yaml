known_limitations:
- 'The Official Gazette is printed in three parallel columns; the parser cuts out the column of the language by its position
  on the page. Justified lines are broken into words in places, so a few headings come out garbled or out of order (for
  example article 1 in English, and the headings of articles 16, 132 and 169 in English, 48, 59, 115 and 117 in French,
  several in Kinyarwanda): the text of such an article stays in the preceding article and its note names the missing numbers.'
- The Kinyarwanda column is read with the article word 'Ingingo ya'; about 19 article headings were not recognised there
  (their text is kept in the preceding article).
- Schedules do not exist in this Constitution; the signatures at the end of the gazette are not stored.
