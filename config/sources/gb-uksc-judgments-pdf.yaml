# Judgments of the UK Supreme Court published as PDF on the Court's own website (the judgments of 2009 to 2020, and any later
# judgment without an HTML page). Terms and access rules are those of gb-uksc-judgments (read 2026-10-14, re-read 2026-10-16):
#   https://supremecourt.uk/robots.txt - "User-agent: *" / "Disallow: /contact-us/book-room-hearing": case pages, PDFs and the
#        sitemap are allowed.
#   https://www.supremecourt.uk/about/terms-and-conditions - "You may use and re-use Crown copyright material from this website, other
#        than the Royal Arms and departmental logos, under the terms of the Open Government Licence, provided it is reproduced
#        accurately and not in a misleading context."
#   https://supremecourt.uk/sitemap.xml - one page per appeal, /cases/uksc-<year>-<number> (1,584 pages, 2009 to 2026); each case page
#        has the case id, title, judgment date, neutral citation, the justices and the link to the judgment PDF
#        (/uploads/uksc_<year>_<number>_judgment_<hash>.pdf). The 156 pages /cases/judgments/uksc-<year>-<number> hold the judgment as
#        HTML (source gb-uksc-judgments) and are not repeated here.
#   Not used: the National Archives' Find Case Law (computational analysis needs a licence, see gb-find-case-law) and BAILII (robots
#        disallow).
schema_version: 1
id: gb-uksc-judgments-pdf
name: UK Supreme Court judgments (supremecourt.uk, PDF)
publisher: The Supreme Court of the United Kingdom
kind: official_court_database
authority: official_non_authentic
jurisdictions: [GB]
document_kinds: [judgment]
languages: [en]
coverage: >-
  The judgments of the UK Supreme Court from 2009 (when the Court began: neutral citations [2009] UKSC 1 on) that the Court publishes as
  PDF on its website: the case page (case id, title, date, neutral citation, justices) and the judgment text, with its numbered
  paragraphs. About 1,430 case pages are listed; appeals without a judgment yet and joined appeals (the same judgment) are skipped, so
  the expected number of judgments is of the order of 1,000. The judgments of 2021 on that the Court also publishes as HTML are in
  gb-uksc-judgments. Press summaries and the Judicial Committee of the Privy Council are not ingested.
access:
  method: permitted_web_retrieval
  endpoint: config/manifests/gb-uksc-judgments-pdf.yaml
  authentication: none
update_frequency: >-
  When the Court hands down a judgment; ULIS re-reads the sitemap (scripts/build_uksc_pdf_manifest.py) and extends the manifest. A case
  page is fetched again only with an empty cache (a page cached before its judgment was given must be removed from the cache).
rate_limits: >-
  None published. ULIS makes one request at a time, 5 s apart (about 1,430 case pages and about 1,000 PDFs: 3.4 hours), with an
  identifying User-Agent, and caches every page and PDF under var/sources/supremecourt.uk/.
licence:
  id: OGL-UK-3.0
  name: Open Government Licence v3.0 (Crown copyright material on the Supreme Court's website)
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  review_status: approved
  reviewed_by: >-
    ULIS project, from the Court's terms and conditions page, its robots.txt and the licence text (read 2026-10-14). The Court's
    statement covers "Crown copyright material from this website"; judgments are Crown copyright (to verify). Not reviewed by counsel.
  reviewed_on: 2026-10-14
  redistribution: allowed
  bulk_download: allowed
  automated_processing: allowed
  commercial_use: allowed
  attribution_required: true
  attribution_text: >-
    Contains public sector information licensed under the Open Government Licence v3.0. Source: The Supreme Court of the United
    Kingdom (www.supremecourt.uk). Judgment text as published on the Court's website (PDF text layer); not the signed judgment.
    Paragraphs recovered from the PDF by ULIS.
  conditions:
    - Acknowledge the source with the OGL attribution statement and a link to the licence; reproduce the text accurately and not in a misleading context (the Court's condition).
    - The licence does not cover personal data in the Information or third-party rights; some judgments carry reporting restrictions (anonymity orders), which ULIS leaves as published.
    - No endorsement by the Court or the Crown may be suggested.
  notes: >-
    The Court's terms grant OGL for its website content; no restriction on automated access or computational analysis is stated
    on the Court's site or in robots.txt. The Find Case Law licence question concerns the National Archives' own service.
    Counsel review recommended before production use.
provenance: >-
  https://supremecourt.uk/cases/uksc-<year>-<number> and the judgment PDF it links, fetched with an identifying User-Agent; both are
  cached byte for byte with their URL and retrieval time under var/sources/supremecourt.uk/ and stored unchanged in one JSON bundle.
known_limitations:
  - >-
    The text is the text layer of the Court's PDF, read with pdftotext. Page footers are removed and the lines of a paragraph are
    joined; footnotes stay where the PDF puts them (the end of the paragraph that ends the page); tables and quotations in another
    layout may be joined into their paragraph; headings are recognised by a heuristic (a short line after a finished sentence). A PDF
    without a text layer is skipped (no OCR).
  - Numbered paragraphs are read from the text (1., 2., 3. ...); a quoted numbered passage stays unnumbered. The paragraph numbers of
    a judgment with several opinions that restart at 1 are kept, with a suffix on the identifier.
  - >-
    There are no hyperlinks in the PDF, so legislation is not linked; links to other judgments are by the pattern "[yyyy] UKSC n"
    only. Later treatment of a judgment is not recorded.
  - Website version of the judgment, not the signed judgment. Joined appeals have one page per case number; only the first is read.
  - Only the Supreme Court (GB-UKSC); the Privy Council's judgments (jcpc.uk, same terms) are in gb-jcpc-judgments where they are HTML.
status: active
connector: uksc_pdf
parser: uksc_pdf
