known_limitations:
- A copy on the publisher's site, not the authentic publication of the constitution; the publisher's own edition date (if
  any) is the edition date, else the retrieval date.
- Amendments adopted after the edition date are not applied; no history is held.
- The page does not say which version of an Act a PDF is (an Act as passed, or with amendments); the retrieval date is the
  edition date. Later amendments, and Acts not on the page, are not covered.
- A link that no longer answers is skipped and reported as a run error; a PDF whose text layer is not readable text is skipped.
  Dzongkha texts are not ingested except where an English PDF also contains them.
