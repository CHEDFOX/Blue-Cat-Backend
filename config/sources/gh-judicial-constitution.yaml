    after chapter 14; osp.gov.gh PDF reproduces a commercial compilation ('Constitutional documents available for the Republic
    of Ghana', with an editor's note) and is not an official text. Footer of judicial.gov.gh: 'Copyright © 2026 Judicial Service
    of Ghana. All Rights Reserved'. Nothing further is requested; no workaround was tried.
