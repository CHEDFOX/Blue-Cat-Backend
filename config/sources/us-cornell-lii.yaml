#   https://www.law.cornell.edu/lii/terms/documentation ("Site Documentation") - "The compilation of materials gathered here
#        by the editors of the LII and the pages holding them are protected by copyright, with the copyright held by
#        Cornell University. Distribution of these pages on the Internet does not constitute consent to any use of this
#        material for commercial redistribution"; where "the underlying texts are government documents, those texts lie in
#        the public domain. The LII does not assert copyright in US Government works, but we do claim copyright in markup,
#        navigation apparatus, and other value-added features ... covered by a Creative Commons license" CC BY-NC-SA 2.5
#        (credit LII, no commercial use, share alike); "Potential commercial users/licensors should contact us at
#        permissions@liicornell.org".
#   Only robots.txt, the home page and this terms page were requested; no opinion page was fetched.
