provenance: >-
  The document(s) listed in config/manifests/bd-bdlaws-constitution.yaml, stored byte for byte inside JSON bundles with
  the URL and retrieval time; the text is re-derived from the page or from the PDF's text layer (pdftotext).
known_limitations:
- >-
  A copy on the publisher's site, not the authentic publication of the constitution; the publisher's own edition date (if
  any) is the edition date, else the retrieval date.
- Amendments adopted after the edition date are not applied; no history is held.
- >-
  The English text is an authorised translation; under article 153(2) the Bengali text prevails in a conflict. This source
  is not an authentic text.
- >-
  The Bengali page numbers the articles with Bengali digits and a danda ("৭ক।") and a letter for added articles ("ক", "খ"
  ...); the parser reads the digits as 7 and the letters as a, b ... for the identifier (art-7a), the label is the document's
  own. The authentic text is the Bengali one under article 153(2), but this page is the Division's copy, not the authenticated
  publication.
- >-
  The page prints no edition date; the retrieval date is the edition date. The latest amendment the text shows is the Constitution
  (Seventeenth Amendment) Act, 2018; later amendments, if any, are not applied.
- >-
  The footnote references of the amendments ("5[2A. ...") are part of the printed text and stay in it; where a reference
  stands before the number of an article, the note of that article says so, and the reference is not part of its stored
  text.
- >-
  The footnotes of the amending Acts that the page prints after article 153 are stored as blocks of paragraphs (blk-N),
  not attached to the articles. The four Schedules of the Constitution are not on this page.
status: active
connector: constitution_docs
parser: constitution_text
