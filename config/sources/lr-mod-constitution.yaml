schema_version: 1
id: lr-mod-constitution
name: Constitution of Liberia - Ministry of National Defense of Liberia (mod.gov.lr)
publisher: Ministry of National Defense of Liberia (mod.gov.lr)
kind: official_legislation_portal
authority: official_non_authentic
jurisdictions:
- LR
document_kinds:
- constitution
languages:
- en
coverage: >-
  The Constitution of Liberia in en as published by Ministry of National Defense of Liberia (mod.gov.lr): 1 document(s). Preamble
  and 97 articles of the Constitution of Liberia as the Ministry of National Defense's PDF prints them (one heading not recognised).
access:
  method: permitted_web_retrieval
  endpoint: config/manifests/lr-mod-constitution.yaml
  authentication: none
update_frequency: Not stated; the retrieval date is the edition date unless the document prints one.
rate_limits: >-
  As recorded under robots.txt in the header; ULIS waits at least 5 s between requests (the Crawl-delay when it is longer),
  identifies itself, caches every download and makes 2 request(s) (robots.txt and 1 document(s)).
licence:
  id: LR-official-text-no-terms
  name: >-
    Official legal text published by Ministry of National Defense of Liberia (mod.gov.lr); no terms of reuse found (page footer:
    "© 2020 Armed Forces of Liberia. All rights Reserved" - a generic footer; no terms-of-use or licence ...
  url: https://mod.gov.lr/
  review_status: approved
  reviewed_by: >-
    ULIS project (not counsel), 2026-10-16, from the publisher's own pages quoted in the header of this file: robots.txt (mod.gov.lr/robots.txt
    - "User-agent: *" "Disallow: /wp-admin/" "Allow: /wp-admin/admin-ajax.php"; no Crawl-delay; /wp-content/uploads/ is not
    disallowed) and the terms (page footer: "© 2020 Armed Forces of Liberia. All rights Reserved" - a generic footer; no terms-of-use
    or licence page was found. The Judiciary of Liberia's PDF of the Constitution (judiciary.gov.lr) is a scan without text
    layer and was not used). The Ministry hosts the PDF "THE-1986-CONSTITUTION-OF-THE-REPUBLIC-OF-LIBERIA.pdf" (50 pages,
    text layer): "CONSTITUTION OF THE REPUBLIC OF LIBERIA" with a table of contents, preamble and articles 1 to 97. The PDF
    prints no edition date. The Constitution is an official legal text; no statute excluding official texts from copyright
    was read on the publisher's pages (to verify). Reading: AMBER - the publisher states no restriction on reusing the text
    beyond a generic notice; no permission for automated retrieval is stated either.
  reviewed_on: '2026-10-16'
  redistribution: allowed_with_conditions
  bulk_download: allowed_with_conditions
  automated_processing: allowed_with_conditions
  commercial_use: unknown
  attribution_required: true
  attribution_text: >-
    Constitution of Liberia, Ministry of National Defense of Liberia (mod.gov.lr); retrieved {retrieved_date}. Structured
    and indexed by ULIS; not the authentic text and not endorsed by the publisher.
  conditions:
  - >-
    The text is the publisher's copy (en), not the authentic publication; amendments after the edition date are not applied.
  - >-
    Polite retrieval (identifying User-Agent, 5 s between requests or the Crawl-delay, cached downloads); stop on any refusal.
  notes: >-
    The basis is the official status of the text and the absence of any stated restriction on it; there is no licence. Counsel
    review is recommended before production use.
provenance: >-
  The document(s) listed in config/manifests/lr-mod-constitution.yaml, stored byte for byte inside JSON bundles with the URL
  and retrieval time; the text is re-derived from the page or from the PDF's text layer (pdftotext).
known_limitations:
- >-
  A copy on the publisher's site, not the authentic publication of the constitution; the publisher's own edition date (if
  any) is the edition date, else the retrieval date.
- Amendments adopted after the edition date are not applied; no history is held.
- >-
  A copy on the website of a ministry that is not the Constitution's publisher; the file name says 1986; amendments after
  1986, if any, are not applied.
- 'The heading of article 94 is not recognised: its text is kept in article 93, whose note says so.'
status: active
connector: constitution_docs
parser: constitution_text
