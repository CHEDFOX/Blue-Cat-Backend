name: Argentina
names: {en: Argentina, es: Argentina}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [es]
legal_system:
  families: [civil_law]
  structure: federal
  treaty_reception: monist
  notes: >-
    To verify - federal republic of 23 provinces and the Ciudad Autónoma de Buenos Aires (arts. 1, 5 and 129 CN);
    the provinces keep the powers they did not delegate to the Nation (art. 121 CN), but the Congress enacts the
    national codes (Civil y Comercial, Penal, de Minería, del Trabajo y de la Seguridad Social: art. 75 inc. 12
    CN), which the federal and provincial courts apply. Codified civil-law system.
    Treaties and concordats rank above laws (art. 75 inc. 22 CN), and the human-rights treaties listed there have
    constitutional hierarchy; the Corte Suprema has treated international law as part of the domestic order since
    the 1990s ("Ekmekdjian c. Sofovich"), which is why the reception is recorded as monist. Constitutional review is
    diffuse: every judge may decline to apply a norm in a concrete case, and the Corte Suprema has the last word
    (recurso extraordinario federal). Spanish is the language of the law (the Constitution names no official language;
    to verify).
