  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [lv]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - unitary parliamentary republic under the Satversme (adopted 15 February 1922, in force 7 November
    1922); the Saeima (100 members) legislates, the President of the State promulgates acts (Satversme Art. 69: an act
    enters into force fourteen days after promulgation unless it sets another period), the Cabinet of Ministers
    (Ministru kabinets) issues regulations (noteikumi). Civil-law system (the Civillikums of 1937 in force again since
    1992). Treaties: Art. 68 requires the Saeima's approval of treaties that settle matters decided by legislation;
    Latvia is usually described as monist (ratified treaties are part of the domestic legal order, ranking below the
    Satversme) - to verify, including the rank of treaties against acts. Local governments (novadi, pilsētas) issue
    binding regulations (saistošie noteikumi); not ingested.
legislative_institutions:
  - id: LV-SAEIMA
    name: Saeima (acts - likumi; the Satversme is amended by the Saeima under Art. 76-79, in part with a referendum)
    instrument_types: [constitution, act]
  - id: LV-MK
    name: Ministru kabinets (Cabinet of Ministers - noteikumi, rīkojumi)
