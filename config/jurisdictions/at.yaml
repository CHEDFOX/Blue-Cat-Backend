legal_system:
  families: [civil_law]
  structure: federal
  treaty_reception: mixed
  notes: >-
    To verify - federal state (Bund and nine Länder) with a codified civil-law system (ABGB 1811).
    Constitutional law is not only in the B-VG: constitutional provisions
    ("Verfassungsbestimmungen") also appear in ordinary federal laws (e.g. § 1 DSG). Treaties
    approved under Art. 50 B-VG are generally part of domestic law on publication unless the
    Nationalrat resolves that they are to be implemented by laws (Erfüllungsvorbehalt), hence
    "mixed" here.
