precedent:
  doctrine: jurisprudence_constante
  vertical_binding: false
  notes: >-
    To verify - Austria has no formal doctrine of binding precedent (stare decisis). Courts
    are bound by statute; a decision binds only the parties to the case. In practice lower
    courts follow the settled case law ("ständige Rechtsprechung") of the Oberster Gerichtshof
    (civil and criminal matters) and the Verwaltungsgerichtshof (administrative matters), and
    a deviation from it is a ground for further appeal (e.g. "erhebliche Rechtsfrage"). The
    three apex courts are parallel, not hierarchical. A Verfassungsgerichtshof decision that
    annuls a law or regulation has effect for everyone (Art. 139 and 140 B-VG); that is the
    legal effect of the annulment, not precedent. Lower courts (OLG, LG, BG, BVwG, LVwG) are
    not profiled.
citation:
  module: at
  notes: >-
    Statute pinpoints follow the usual Austrian form "§ 1295 Abs. 1 ABGB", "Art. 7 Abs. 1 B-VG",
    with "Z" (Ziffer) and "lit." (litera) where the structure has them. Decisions are cited by
    court, date and Geschäftszahl as printed in RIS, with the ECLI (decision citations are
    implemented in the module but untested: no decision has been ingested).
  examples:
    - "§ 83 Abs. 3 Z 1 StGB"
    - "Art. 7 Abs. 1 B-VG"
    - "§ 1 Abs. 1 DSG"
publication:
  official_sources: [at-ris-bundesrecht, at-ris-judikatur]
  commencement: >-
    Federal laws enter into force at the end of the day of their publication in the
    Bundesgesetzblatt unless they provide otherwise (to verify: Art. 49 B-VG).
  amendment: >-
    Textual amendment by later federal laws (Novellen) published in the Bundesgesetzblatt; the
    Federal Chancellery's RIS publishes non-binding consolidated versions per paragraph/article.
  repeal: >-
    Express repeal by later law, or annulment by the Verfassungsgerichtshof (Art. 140 B-VG).
    RIS replaces a repealed paragraph's text with an annotation such as "(Anm.: aufgehoben durch ...)".
