    - No point-in-time history has been fetched yet; the end-date field of superseded versions is unverified against real data.
    - RIS consolidated federal law is informational only; the authentic text is the Bundesgesetzblatt (authentic online since 2004), which is not ingested.
    - No regulations (Verordnungen), no Land (state) or municipal law, no treaties, no EU law.
    - "No case law is ingested: at-ris-judikatur (VfGH, VwGH, OGH) is planned only; the court list above is the profile, not a corpus. No citator coverage."
    - RIS dates versions per paragraph/article; an Absatz, Ziffer or litera inherits the period of its paragraph, so an unchanged subdivision shows a new version whenever any part of its paragraph changed.
