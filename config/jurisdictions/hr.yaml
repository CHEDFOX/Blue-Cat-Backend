  notes: Research notes only. Not reviewed by counsel.
official_languages: [hr]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: unknown
  notes: >-
    To verify - unitary parliamentary republic under the Constitution of 1990 (consolidated text NN 85/2010). The Hrvatski
    sabor (parliament) passes laws; the President of the Republic promulgates them within eight days of their passing
    (Ustav članak 89); the Government (Vlada) issues regulations (uredbe) and ministers rulebooks (pravilnici). Civil-law
    system with codified law (Austrian and German influences). Local self-government (općine, gradovi) and counties
    (županije) issue their own acts; they are not ingested. How international treaties rank and take effect is not
    modelled here - to verify against the Constitution.
legislative_institutions:
  - id: HR-SABOR
    name: Hrvatski sabor (acts - zakoni, ustavni zakoni; the Constitution is amended by the Sabor under the Constitution's chapter on amendments)
    instrument_types: [constitution, constitutional_act, act]
  - id: HR-VLADA
    name: Vlada (Government - uredbe, odluke)
    instrument_types: [regulation]
