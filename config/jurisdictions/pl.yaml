legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - unitary parliamentary republic under the Constitution of 2 April 1997 (in force 17 October 1997); the Sejm
    and the Senat legislate (acts - ustawy), the President signs acts and orders their publication in the Dziennik Ustaw,
    the Council of Ministers, ministers and other bodies issue regulations (rozporządzenia) on statutory delegation.
    Civil-law system with codes (kodeksy) as acts of ordinary rank. Treaties: a ratified treaty, once published in the
    Dziennik Ustaw, is part of the domestic legal order and is applied directly unless its application depends on an act
    (Constitution art. 91 ust. 1); a treaty ratified with prior statutory consent takes precedence over acts that cannot be
    reconciled with it (art. 91 ust. 2) - described here as monist, to verify. Local-government and territorial bodies
    issue local enactments (akty prawa miejscowego); not ingested.
