precedent:
  doctrine: no_formal_precedent
  vertical_binding: false
  notes: >-
    To verify - no formal rule of binding precedent: judges are independent and subject only to the Constitution and acts
    (Constitution art. 178 ust. 1), so decisions of the Sąd Najwyższy and the Naczelny Sąd Administracyjny are persuasive
    in practice and widely followed. Exceptions to verify: a resolution of the Sąd Najwyższy or the Naczelny Sąd
    Administracyjny given the force of a legal principle ("moc zasady prawnej") binds the panel that wants to depart from
    it; judgments of the Trybunał Konstytucyjny are final and universally binding (art. 190 ust. 1) and a provision found
    unconstitutional loses its binding force on the date the judgment is published unless the Tribunal sets another date
    (art. 190 ust. 3). The court structure shown is simplified (military, specialised and disciplinary courts are not
    modelled); every court entry is a draft to verify.
citation:
  module: pl
  notes: >-
    The pinpoint from the largest to the smallest unit, then the act's customary abbreviation or its name in the genitive:
    "art. 415 k.c.", "art. 148 § 1 k.k.", "art. 6 ust. 1 pkt 2 lit. a ustawy o ochronie danych osobowych". Articles inserted
    between others carry a superscript ("art. 22¹ k.c.", "art. 18³ᵃ k.p."); a paragraph is "§", a subsection "ust.", a
    point "pkt", a letter "lit.". Abbreviations are set for a table of well-known acts; any other act is cited by the long
    form of its title, the first word in the genitive ("art. 141m ust. 3 ustawy z dnia 29 sierpnia 1997 r. - Prawo
    bankowe"). The formal reference to the official publication (Dz.U. year, position) is not generated but kept in each
    act's metadata.
  examples:
    - "art. 415 k.c."
    - "art. 148 § 1 k.k."
    - "art. 22¹ k.c."
    - "art. 52 § 1 pkt 1 k.p."
    - "art. 7 k.p.a."
    - "art. 35 ust. 1 ustawy o ochronie danych osobowych"
publication:
  official_sources: [pl-eli-sejm]
  commencement: >-
    To verify - acts are signed by the President and published in the Dziennik Ustaw (Dz.U., the Journal of Laws);
    publication is a condition of entry into force (Constitution art. 88 ust. 1) and an act enters into force fourteen days
    after publication unless it states a longer period (Act of 20 July 2000 on the publication of normative acts, art. 4
    ust. 1).
  amendment: >-
    Textual amendment by amending acts. The Marszałek Sejmu announces the consolidated text (tekst jednolity) of an amended
    act in the Dziennik Ustaw as an obwieszczenie, at least once every twelve months while the act is amended (Act of
    20 July 2000, art. 16 ust. 1 and 4, read from the API's text of that Act). The consolidated text is official but
    informative; the authentic text is the act and its amending acts as published (to verify). A consolidated text states
    its legal-status date ("stan prawny").
  repeal: >-
    Express repeal; the consolidated text marks a repealed provision "(uchylony)" or "(pominięty)" and keeps its number.
memberships:
