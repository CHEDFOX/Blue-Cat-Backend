# REAL JURISDICTION - DRAFT, UNVERIFIED. Sweden. Regions and municipalities (which make local
# regulations) are not profiled. EU membership is added separately, with the EU profile.
schema_version: 1
id: SE
profile_version: 0.3.0
name: Sweden
