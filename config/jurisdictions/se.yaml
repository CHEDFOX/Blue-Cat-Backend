precedent:
  doctrine: jurisprudence_constante
  vertical_binding: false
  notes: >-
    To verify - there is no formal rule of binding precedent. Regeringsformen 11 kap. 1 § names
    Högsta domstolen, the hovrätter and the tingsrätter as general courts and Högsta
    förvaltningsdomstolen, the kammarrätter and the förvaltningsrätter as general administrative
    courts. Leave to appeal to Högsta domstolen may be granted where review "är av vikt för ledning
    av rättstillämpningen" (rättegångsbalken 54 kap. 10 §), and a departure from a "rättsgrundsats
    eller lagtolkning, som förut varit antagen av Högsta domstolen" may be referred to the full
    court (3 kap. 6 §). Precedents (prejudikat) of Högsta domstolen and Högsta
    förvaltningsdomstolen are followed in practice by lower courts (de facto binding); other
    decisions are persuasive. Special courts (Arbetsdomstolen, Migrationsöverdomstolen, Mark- och
    miljööverdomstolen, Patent- och marknadsöverdomstolen, Marknadsdomstolen) are profiled only as the highest
    courts of their field; their appeal routes are not modelled.
citation:
  module: se
  notes: >-
    Pinpoint first, then the statute's name: codes (balkar) and fundamental laws by name, other
    statutes with their SFS number (or by an established short name). Chapters are cited only when
    sections restart in each chapter. Paragraphs (stycken) are always cited by ordinal. Customary
    abbreviations (BrB, RF, LAS) are not generated.
  examples:
    - "3 kap. 1 § första stycket brottsbalken"
    - "1 kap. 2 § första stycket regeringsformen"
    - "36 § första stycket avtalslagen"
    - "7 § första stycket lagen (1982:80) om anställningsskydd"
    - "9 § första stycket förvaltningslagen (2017:900)"
    - "2 kap. 1 § första stycket 1 regeringsformen"
publication:
  official_sources: [se-riksdagen-sfs, se-rattspraxis]
  commencement: >-
    "Av författning skall framgå när den träder i kraft." (lag (1976:633) om kungörande av lagar
    och andra författningar, 13 §). Laws and ordinances are published in Svensk
    författningssamling (4 §), electronically; a statute is promulgated when published there on
    the website (5 §).
  amendment: >-
    Textual amendment by amending statutes, each published in Svensk författningssamling. The
    Government Offices keep consolidated texts (SFST) marking the last amending statute of each
    section ("Lag (2010:1408)."); the Riksdag republishes them as open data.
  repeal: >-
    Express repeal; the consolidation replaces a repealed section with a note ("7 § har upphävts
    genom lag (1988:942).").
memberships:
  # Accession to the European Union on 1 January 1995 (to verify).
  - organisation: EU
    from_date: 1995-01-01
coverage:
  corpus_status: pilot
  known_gaps:
    - The statutes in force in the Riksdag's open data (laws, ordinances and notices; 5,336 in the source manifest) are ingested, all as current consolidated (non-authentic) texts; the statutes as published in Svensk författningssamling are not ingested. Repealed statutes, the 192 records without a YYYY:N number (N series, RFS, old printed volumes) and a statute whose old-style sections are divided into "mom." are not.
    - No history - one current consolidation per statute. Dates are known only for wordings that change on a date the consolidation states (e.g. 2027-01-01); everything else is attested only at the record's publication date (start unknown).
    - Amendments awaiting a commencement date set by the Government ("den dag som regeringen bestämmer") are recorded as prospective and reported as outstanding changes.
    - Chapters and headings are context, not provisions. Paragraph (stycke) numbers are not printed; they are derived from the layout. A statute without numbered sections is one unnumbered provision; an annex (bilaga) is one provision without its table layout.
    - The other fundamental laws (successionsordningen, tryckfrihetsförordningen, yttrandefrihetsgrundlagen) are in the manifest but only regeringsformen is named as a fundamental law in citations; no treaties, no regional or municipal regulations, no agencies' regulations outside Svensk författningssamling.
    - Case law is the official case reports (rättsfallsreferat) of the higher courts from Domstolsverket's open data (se-rattspraxis), not the courts' judgments and decisions themselves (open data from March 2025, in PDF), and not the lower courts' decisions; no citator beyond the publisher's statute references.
    - Swedish uses PostgreSQL's swedish text-search configuration (stemming only; no compound splitting).
