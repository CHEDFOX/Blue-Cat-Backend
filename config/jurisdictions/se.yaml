verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [sv]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: dualist
  notes: >-
    To verify - unitary state and constitutional monarchy: the King or Queen who holds the throne
    under the Act of Succession is head of state (regeringsformen 1 kap. 5 §); "All offentlig makt
    i Sverige utgår från folket" (1 kap. 1 §); the Riksdag makes the laws (1 kap. 4 §); the
    Government governs and is accountable to the Riksdag (1 kap. 6 §); municipalities at local and
    regional level (1 kap. 7 §). Four fundamental laws: regeringsformen, successionsordningen,
    tryckfrihetsförordningen and yttrandefrihetsgrundlagen (1 kap. 3 §); only regeringsformen is
    ingested. Nordic civil-law system. Treaties are concluded by the Government (10 kap. 1 §), with
    the Riksdag's approval when they require legislation or concern a matter for the Riksdag (10
    kap. 3 §); a treaty is understood to need incorporation or transformation by statute to have
    domestic effect (dualist) - to verify. Laws may not be made in conflict with Sweden's
    obligations under the European Convention on Human Rights (2 kap. 19 §). Swedish is the
    language of legislation; the Language Act (2009:600) is not ingested - to verify.
