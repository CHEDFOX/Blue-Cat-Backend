    rank: 2
    appeals_to: [DK-HR]
  - id: DK-VLR
    name: Vestre Landsret (Western High Court)
    rank: 2
    appeals_to: [DK-HR]
  - id: DK-SHR
    name: Sø- og Handelsretten (Maritime and Commercial High Court)
