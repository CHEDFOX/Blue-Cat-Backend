# REAL JURISDICTION - DRAFT, UNVERIFIED. Denmark (the Realm's legislation for Denmark proper). The
# Faroe Islands and Greenland (home rule / self-government within the Realm) are out of scope. EU
# membership is deliberately not recorded here (added separately with the EU profile).
schema_version: 1
id: DK
profile_version: 0.1.0
name: Denmark
names: {da: Danmark, en: Denmark}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [da]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: dualist
  notes: >-
    To verify - unitary constitutional monarchy under Danmarks Riges Grundlov (lov nr. 169 af 5. juni
    1953); legislative power rests jointly with the King and the Folketing (Grundloven § 3), and an
    Act becomes law on royal assent (stadfæstelse) and is published in Lovtidende. Nordic legal
    tradition, usually classed with the civil-law family (no comprehensive civil code). Dualist:
    treaties bind Denmark internationally but have domestic effect through incorporation or
    transformation by statute (e.g. the ECHR, incorporated by lov nr. 285 af 29. april 1992) - to
    verify. The Faroe Islands and Greenland have their own legislatures and legislation and are not
    profiled.
legislative_institutions:
  - id: DK-LOVGIVER
    name: Kongen og Folketinget i forening (Grundloven § 3); Grundloven amended under § 88
    instrument_types: [constitution, act]
  - id: DK-REGERING
    name: Ministre (bekendtgørelser under statutory authority)
    instrument_types: [executive_order]
instrument_types: [constitution, act, executive_order]
