  module: constitution_b
  notes: >-
    "Mexico Constitution art. N" with the article number as the Cámara's PDF prints it (the ordinal sign of "Artículo 1o." is not
    part of the label).
  examples:
    - Mexico Constitution art. 1
    - Mexico Constitution art. 133
publication:
  official_sources: [mx-diputados-constitution]
  commencement: >-
    To verify - the compilation says the Constitution was published in the Diario Oficial de la Federación on 5 February 1917; the
    ingested text does not record when each article took effect.
  amendment: >-
    The Cámara's PDF annotates each amended paragraph ("Párrafo reformado DOF 10-06-2011"); ULIS keeps the annotations as notes and
    does not record when an amendment took effect.
  repeal: Not modelled.
coverage:
  corpus_status: pilot
  known_gaps:
    - Only articles 1 to 136 of the federal Constitution (mx-diputados-constitution); the transitional articles, statutes, regulations, treaties and case law are not ingested.
    - The Cámara's compilation is informative; the Diario Oficial de la Federación is authentic and not ingested.
    - No history of earlier wordings and no provision start dates.
    - The federal structure (states, Mexico City, municipalities), courts and precedent rules are not described.
