official_languages: [es]
legal_system:
  families: [civil_law]
  structure: federal
  treaty_reception: monist
  notes: >-
    To verify - a federal republic of states and Mexico City with a civil-law tradition. Art. 133 of the Constitution as ingested
    makes the Constitution, the laws of Congress that emanate from it and the treaties "the Supreme Law of the whole Union"; the
    profile records treaty reception as monist on that basis only. The states have their own constitutions, which are not ingested.
