coverage:
  corpus_status: pilot
  known_gaps:
    - "No Indian legislation is ingested: India Code, the Legislative Department, the Gazette of India (eGazette), the Law Commission and data.gov.in refused the bot (HTTP 403) or did not answer (connection reset) on 2026-10-16, so no Act, subordinate legislation, State Act or the Constitution of India is loaded, and no Act's history (as enacted, amended, repealed) is available."
    - "Case law is the Supreme Court judgments the Court publishes as JUDIS PDFs on api.sci.gov.in under numbers 1 to 45100 (about 1950 to April 2017, English). Judgments from 2017 on are published under addresses that cannot be listed without the Court's search (behind a CAPTCHA) and are not ingested; reported-only coverage is not claimed for the earlier years either."
    - "Older judgments (before about 2009) carry no paragraph numbers and no paragraph breaks in the PDF text layer, so their text is cut into unnumbered passages; scanned PDFs without a text layer are skipped (no OCR)."
    - "Judgments are the Court's website PDFs converted to text, not the signed originals; headnotes and catchwords printed with older judgments are editorial matter of the Court's reporters."
    - "No High Court, tribunal or district court judgments: the eCourts portals sit behind a CAPTCHA, and the only bulk copies (AWS Open Data: Dattam Labs) were produced by solving it, so they are rejected (see in-dattam-court-judgments)."
    - "No neutral citations (the Court's \"INSC\" neutral citation starts in 2023, after the ingested range), no citator or subsequent-history tracking, no links between judgments."
    - "States, Union Territories, High Courts and tribunals are not yet modelled."
