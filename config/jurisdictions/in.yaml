precedent:
  doctrine: stare_decisis
  vertical_binding: true
  notes: >-
    To verify - Article 141 of the Constitution: law declared by the Supreme Court is binding on
    all courts within the territory of India. The 25 High Courts are listed only so that a forum
    court can be named (their judgments are not ingested); the High Courts' own precedent rules,
    tribunals, subordinate courts and bench-strength rules are not modelled.
