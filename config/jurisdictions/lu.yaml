    rank: 1
  - id: LU-CA
    name: Cour d'appel
    rank: 2
    appeals_to: [LU-CASS]
  - id: LU-TA
    name: Tribunaux d'arrondissement (Luxembourg, Diekirch)
    rank: 3
    appeals_to: [LU-CA]
  - id: LU-JP
    name: Justices de paix (Luxembourg, Esch-sur-Alzette, Diekirch)
