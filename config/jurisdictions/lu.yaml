verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
# Loi du 24 février 1984 sur le régime des langues: Luxembourgish is the national language; French, German and
# Luxembourgish are the languages of administration and justice; laws are drafted in French. To verify.
official_languages: [lb, fr, de]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - civil-law system of Napoleonic origin with codified private, criminal and procedural law (Code civil,
    Code pénal, Code de procédure civile, Code de procédure pénale, Code de commerce, Code du travail), a
    constitutional monarchy with a unicameral parliament (Chambre des Députés). Legislation is drafted and
    published in French (loi du 24 février 1984 sur le régime des langues); German and English texts on Legilux
    are translations. International treaties are understood to apply directly once ratified and published, and to
    prevail over national statutes (monism). Texts are published in the Mémorial A (Journal officiel); since the loi
    du 23 décembre 2016 concernant le Journal officiel only its electronic version is authentic.
legislative_institutions:
  - id: LU-CHAMBRE
    name: Chambre des Députés (with the Grand-Duc, who promulgates laws)
    instrument_types: [constitution, law, code]
  - id: LU-GOUVERNEMENT
    name: Grand-Duc and Government (règlements et arrêtés grand-ducaux) and ministers (règlements et arrêtés ministériels)
    instrument_types: [grand_ducal_regulation, grand_ducal_decree, ministerial_regulation, ministerial_decree]
instrument_types:
