legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: mixed
  notes: >-
    To verify - Italian Republic (art. 1 Cost.), a unitary State with regional autonomy: the 20 regions
    (five with special statutes) have legislative powers under Title V of Part II of the Constitution
    (art. 117), which this profile does not cover. Civil-law system with codified private and criminal
    law (Codice civile, Codice penale) and a rigid written Constitution (art. 138). Generally recognised
    rules of international law are adapted automatically (art. 10(1) Cost.); treaties are ratified by the
    President after authorisation by law where required (art. 80) and take effect domestically through
    an order of execution in a law or decree (hence "mixed"). Legislative power is bound by the
    Constitution and by EU and international obligations (art. 117(1)). Italian is the official language
    of the State; German (Trentino-Alto Adige/Südtirol), French (Valle d'Aosta) and others are protected
    or co-official in certain areas (art. 6 Cost.; special statutes), which is not modelled here.
