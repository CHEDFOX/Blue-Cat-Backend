precedent:
  doctrine: no_formal_precedent
  vertical_binding: false
  notes: >-
    To verify - no formal stare decisis: judges are subject only to the law (art. 101(2) Cost.). The Corte
    di cassazione has the task of ensuring the correct application and uniform interpretation of the law
    (art. 65 of the ordinamento giudiziario, R.D. 12/1941) and its Sezioni Unite settle conflicts of case
    law; a section that disagrees with a principle of the Sezioni Unite must refer the matter back to them
    (art. 374(3) c.p.c.), and in administrative justice the Adunanza plenaria of the Consiglio di Stato has
    a similar role (art. 99 c.p.a.). Judgments of the Corte costituzionale that declare a provision
    unconstitutional take general effect from the day after their publication (art. 136 Cost.); other
    decisions of the Corte have effect between the parties, and interpretative decisions are followed in
    practice. Corte dei conti, giudici di pace and other judges are not profiled.
citation:
  module: it
  notes: >-
    Article, comma, lettera and numero, followed by the abbreviation of the act: "art. 2043 c.c.",
    "art. 3, comma 1, Cost.", "art. 2, comma 1, lett. a), d.lgs. 196/2003". A bare article is followed by a
    space and the abbreviation, and any subdivision by commas. Preliminary provisions of the Codice civile:
    "art. 12 disp. prel. c.c."; transitional and final provisions of the Constitution: "XIII disp. trans.
    fin. Cost.". To verify against Italian practice (some writers use "co." for comma, "let." for lettera,
    "art. 3 co. 1 Cost." without commas, or "art. 3, primo comma").
  examples:
    - "art. 2043 c.c."
    - "art. 575 c.p."
    - "art. 3, comma 1, Cost."
    - "art. 2, comma 1, lett. a), d.lgs. 196/2003"
    - "art. 18 L. 300/1970"
    - "art. 12 disp. prel. c.c."
    - "XIII disp. trans. fin. Cost."
publication:
  official_sources: [it-normattiva]
  commencement: >-
    To verify - laws are promulgated by the President of the Republic and published at once in the
    Gazzetta Ufficiale, and enter into force on the fifteenth day after publication unless they fix another
    term (art. 73 Cost.; art. 10 disp. prel. c.c.). Decree-laws enter into force on the day of publication
    or as they provide and must be converted into law within sixty days (art. 77 Cost.); legislative decrees
    are issued under a delegation law (art. 76). The Gazzetta Ufficiale is the only authentic text;
    Normattiva states that its texts are not official.
  amendment: >-
    Amendments are made by later acts and printed in the Gazzetta Ufficiale. Normattiva consolidates them
    in a "multivigente" text (non-authentic) and can show an act as it applies on any date.
  repeal: >-
    To verify - express, tacit (incompatibility) or by new regulation of the whole matter (art. 15 disp.
    prel. c.c.), and by declaration of unconstitutionality (art. 136 Cost.). Normattiva prints repealed
    provisions as "((ARTICOLO ABROGATO DA ...))".
