precedent:
  doctrine: stare_decisis
  vertical_binding: true
  notes: >-
    To verify - decisions of the Supreme Court bind lower federal courts and, on federal
    questions, state courts. The thirteen courts of appeals (rank 2) are modelled so that Supreme
    Court decisions rank above them; a court of appeals binds the district courts of its own
    circuit and, in general, its own later panels (an en banc court may overrule), not the other
    circuits. District courts, specialised federal courts, the Court of Federal Claims and all
    state courts are not modelled, so a forum court can only be one of the courts listed here.
