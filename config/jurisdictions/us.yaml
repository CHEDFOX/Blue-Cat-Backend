publication:
  official_sources: [us-gpo-uslm-samples, us-uscode-house]
  commencement: >-
    To verify - absent a contrary provision, an Act takes effect on the date of enactment.
    Agency rules take effect on the date stated in the Federal Register.
  amendment: Textual amendment by later Acts and rules; the US Code and the CFR are codifications.
  repeal: Express repeal by later Act; regulations are removed or amended by agency rule.
coverage:
  corpus_status: pilot
  known_gaps:
    - Besides ten United States Code titles, only the US Government Publishing Office's USLM sample files are ingested; this is a sample, not a complete or current collection.
    - Only ten positive-law titles of the United States Code are ingested (1, 5, 11, 17, 18, 28, 31, 35, 38, 44), as one online release point (current through Public Law 119-120, 7 October 2026), without earlier release points, appendices or notes. The other titles (including 26 and 42, which are not positive law and only prima facie evidence) are not ingested; the public laws in the sample are as enacted, not as amended.
    - CFR text is from 2018-2019 annual editions only; later amendments are not reflected.
    - Federal Register documents, Statutes at Large volumes, engrossed amendments and some bill stages without a dated action are not ingested.
    - >-
      No case law is ingested. The only open source examined, the Caselaw Access Project (CC0 data), is planned
      but not usable: its data host's robots.txt disallows all robots (see docs/jurisdictions/us-case-law.md).
      No State, territorial or tribal law.
    - >-
      The court hierarchy models the Supreme Court and the thirteen courts of appeals only; district courts and
      state courts are not modelled. Judicial treatment (overruled, distinguished) is in no ingested source and
      would never be inferred.
    - Provision-specific effective dates are not extracted from Acts or rules.
