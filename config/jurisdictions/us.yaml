precedent:
  doctrine: stare_decisis
  vertical_binding: true
  notes: >-
    To verify - decisions of the Supreme Court bind lower federal courts and, on federal
    questions, state courts. The thirteen courts of appeals (rank 2) rank below it; a court of appeals binds the
    district courts of its own circuit and, in general, its own later panels (an en banc court may overrule), not the other
    circuits. The district, bankruptcy and specialised federal courts and the State courts of CourtListener's court table
    are listed with the appeal routes the law fixes and the table lets the generator derive (district court to the
    circuit of its State, bankruptcy court to its district court, State intermediate court to the State's highest
    court, State highest court to the Supreme Court on federal questions); where a route is not derived the court
    has none and nothing is inferred. A State court's decision is persuasive outside its State; the profile does not
    encode the State boundary, so a forum court is how to ask for binding weight.
citation:
  module: us
  examples:
    - "Promoting Women in Entrepreneurship Act, Pub. L. No. 115-6, § 2(1), 131 Stat. 11 (2017)"
    - "27 C.F.R. § 478.11 (2018)"
    - "12 CFR 220.1(b)"
    - "H.R. 1000, 116th Cong. § 2(a) (2019)"
    - "Roe v. Wade, 410 U.S. 113, 153 (1973)"
    - "Kolenc v. HHS, No. 23-1808 (Fed. Cir. Jan. 3, 2024)"
publication:
  official_sources:
    - us-gpo-uslm-samples
    - us-uscode-house
    - us-ecfr
    - us-govinfo-bulk-statutes
    - us-govinfo-bulk-cfr-fr
  commencement: >-
    To verify - absent a contrary provision, an Act takes effect on the date of enactment.
    Agency rules take effect on the date stated in the Federal Register.
  amendment: Textual amendment by later Acts and rules; the US Code and the CFR are codifications.
  repeal: Express repeal by later Act; regulations are removed or amended by agency rule.
coverage:
  corpus_status: pilot
  known_gaps:
    - >-
      United States Code: all 53 titles are listed (one online release point, current through Public Law 119-120,
      7 October 2026; no earlier release points, appendices or notes). 27 are positive law; the other 26 (including 26 and
      42) are editorial compilations and only prima facie evidence of the law (1 U.S.C. 204): their results carry the
      NOT_POSITIVE_LAW limitation, and the Statutes at Large control.
    - >-
      Enacted law: the Statutes at Large, volumes 1 to 138 (1789 to January 2025) and the public and private laws of the
      119th Congress, as GPO's USLM "beta" XML, as enacted (dated from approval, later amendments not tracked); statute
      compilations of Acts (unofficial, current through the public law the file names). Concurrent resolutions,
      proclamations and treaties in the volumes are not ingested. The GPO USLM sample files remain a small separate sample.
    - >-
      Regulations: the eCFR is current text only and unofficial; the annual editions of the CFR in GovInfo's bulk
      repository (1996-2026, one version per part and edition, attested at the edition's revision date) give the history,
      but are GPO's XML rendition, not the official PDF; they must be loaded before the eCFR (load-all does). Federal
      Register: only final rules of 2022-2026 (preamble and regulatory text, no start date); proposed rules, notices,
      presidential documents and earlier years are not ingested. Federal agency guidance is not ingested.
    - Engrossed amendments and some bill stages without a dated action are not ingested.
    - >-
      Case law ingested: United States Reports volumes 2-586 from GovInfo (OCR text of the bound volumes; only the cases
      whose page headers the parser recognises, about four in five in the volumes sampled and fewer before 1900), opinions
      of the thirteen courts of appeals from GovInfo's USCOURTS collection (PDF text layer; scans skipped), and the cases
      that the default scope of CourtListener's bulk files selects (docs/markets/us-cases.md: the Supreme Court in every
      year and the federal appellate and State high courts from the years the manifest names; the rest of the
      publication, about ten million cases, is a manifest change away). The text of CourtListener is the publisher's
      aggregation (OCR of printed reporters, court-website HTML or PDF text), not authentic. ULIS records no judicial
      treatment (it would never be inferred), so every decision must be checked for later history elsewhere.
    - >-
      Sources examined and not used: the Caselaw Access Project's own host (CC0 data, but its robots.txt disallows all
      robots; the same cases arrive through CourtListener's bulk files), CourtListener's website (HTTP 403 for the ULIS
      bot; its public S3 bulk files are used instead), Cornell LII (terms restrict commercial use of its compilation),
      Justia (terms page HTTP 403), and the Supreme Court's own site (PDF only, planned); see
      docs/jurisdictions/us-case-law.md and docs/markets/us-cases.md. No State, territorial or tribal legislation.
    - >-
      Trial courts of the States (about 2,600 courts in CourtListener's table, mostly historical), tribal courts,
      administrative bodies and the courts of the territories other than the highest ones are not modelled. Judicial
      treatment (overruled, distinguished) is in no ingested source and would never be inferred.
    - Provision-specific effective dates are not extracted from Acts or rules.
