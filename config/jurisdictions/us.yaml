coverage:
  corpus_status: pilot
  known_gaps:
    - >-
      United States Code: all 53 titles are listed (one online release point, current through Public Law 119-120,
      7 October 2026; no earlier release points, appendices or notes). 27 are positive law; the other 26 (including 26 and
      42) are editorial compilations and only prima facie evidence of the law (1 U.S.C. 204): their results carry the
      NOT_POSITIVE_LAW limitation, and the Statutes at Large control.
    - >-
      Enacted law: the Statutes at Large, volumes 1 to 138 (1789 to January 2025) and the public and private laws of the
      119th Congress, as GPO's USLM "beta" XML, as enacted (dated from approval, later amendments not tracked); statute
      compilations of Acts (unofficial, current through the public law the file names). Concurrent resolutions,
      proclamations and treaties in the volumes are not ingested. The GPO USLM sample files remain a small separate sample.
    - >-
      Regulations: the eCFR is current text only and unofficial; the annual editions of the CFR in GovInfo's bulk
      repository (1996-2026, one version per part and edition, attested at the edition's revision date) give the history,
      but are GPO's XML rendition, not the official PDF; they must be loaded before the eCFR (load-all does). Federal
      Register: only final rules of 2022-2026 (preamble and regulatory text, no start date); proposed rules, notices,
      presidential documents and earlier years are not ingested. Federal agency guidance is not ingested.
    - Engrossed amendments and some bill stages without a dated action are not ingested.
    - >-
      Case law ingested: United States Reports volumes 2-586 from GovInfo (OCR text of the bound volumes; only the cases
      whose page headers the parser recognises, about four in five in the volumes sampled and fewer before 1900) and
      opinions of the thirteen courts of appeals from GovInfo's USCOURTS collection (PDF text layer; scans skipped).
      Supreme Court decisions after volume 586 (the 2018 Term) are not ingested, so a later decision that overruled or
      limited an ingested case is missing; ULIS records no judicial treatment (it would never be inferred), so every
      ingested decision must be checked for later history elsewhere. District, bankruptcy and state courts are absent.
    - >-
      Sources examined and not used: the Caselaw Access Project (CC0 data, but its host's robots.txt disallows all
      robots), CourtListener (HTTP 403 for the ULIS bot), Cornell LII (terms restrict commercial use of its
      compilation), Justia (terms page HTTP 403), and the Supreme Court's own site (PDF only, planned); see
      docs/jurisdictions/us-case-law.md. No State, territorial or tribal law.
    - >-
      The court hierarchy models the Supreme Court and the thirteen courts of appeals only; district courts and
      state courts are not modelled. Judicial treatment (overruled, distinguished) is in no ingested source and
      would never be inferred.
    - Provision-specific effective dates are not extracted from Acts or rules.
