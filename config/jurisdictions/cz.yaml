# REAL JURISDICTION - DRAFT, UNVERIFIED. Czechia (national legislation, Sbírka zákonů). Territorial self-governing bodies'
# generally binding ordinances (obecně závazné vyhlášky, nařízení obcí a krajů) and the Sbírka mezinárodních smluv are
# not profiled. EU membership is deliberately not recorded here (added separately with the EU profile).
