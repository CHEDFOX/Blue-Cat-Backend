legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - unitary parliamentary republic under the Constitution of the Czech Republic (Ústava České republiky,
    ústavní zákon 1/1993 Sb., in force from 1 January 1993). The constitutional order also includes the Charter of
    Fundamental Rights and Freedoms (2/1993 Sb.) and other constitutional acts (Ústava čl. 112). Civil-law system of
    the Central European tradition (Civil Code 89/2012 Sb., Criminal Code 40/2009 Sb., Labour Code 262/2006 Sb.).
    Legislative power: the Parliament (Poslanecká sněmovna and Senát, čl. 15); acts are signed by the President and
    promulgated in the Sbírka zákonů (čl. 52). Promulgated treaties approved by the Parliament are part of the legal
    order and take precedence over acts (čl. 10) - to verify. Czech is the language of legislation.
