precedent:
  doctrine: no_formal_precedent
  vertical_binding: false
  notes: >-
    To verify - no formal rule of binding precedent (civil-law system). Enforceable decisions of the Constitutional
    Court are binding on all authorities and persons (Ústava čl. 89 odst. 2) and its annulment of an act or provision
    is published in the Sbírka zákonů; the Supreme Court and the Supreme Administrative Court unify the case law of
    the ordinary and administrative courts, and lower courts in practice follow it. The court hierarchy and appeal
    routes are simplified here (the specialised appeal routes and the administrative courts - regional courts acting
    as administrative courts - are not modelled). Case law is not ingested.
citation:
  module: cz
  notes: >-
    Czech convention: the pinpoint comes first, then the name of the act in the genitive - "§ 2910 občanského
    zákoníku", "§ 40 odst. 1 trestního zákoníku", "čl. 2 odst. 3 Ústavy České republiky"; other acts by number -
    "§ 5 odst. 2 zákona č. 110/2019 Sb.". Pinpoint abbreviations: čl., §, odst., písm. a), bod. The genitive names of
    the codes are a small table in the module; other acts are cited by number.
  examples:
    - "§ 2910 občanského zákoníku"
    - "§ 40 odst. 1 trestního zákoníku"
    - "§ 52 odst. 1 zákoníku práce"
    - "čl. 2 odst. 3 Ústavy České republiky"
    - "§ 5 odst. 2 zákona č. 110/2019 Sb."
publication:
  official_sources: [cz-esbirka-opendata]
  commencement: >-
    Acts are signed by the President and promulgated in the Sbírka zákonů, which since 1 January 2024 is published
    only electronically in e-Sbírka (zákon 222/2016 Sb. - to verify). An act states its day of entry into force
    (účinnost); it cannot take effect before promulgation (Ústava čl. 52 odst. 1; zákon 309/1999 Sb. - to verify).
    e-Sbírka publishes the consolidated texts as time versions (časová znění) dated by the day each takes effect.
  amendment: >-
    Textual amendment by amending acts (novely). e-Sbírka shows each act as a series of versions (znění): the text as
    promulgated and a consolidated time version for each day on which the text changes, with the days it takes effect
    and ceases to have effect; parts of a version that take effect on a later day carry that day.
  repeal: >-
    Express repeal by a later act; the consolidated texts omit repealed provisions, and the last version of a repealed
    act is marked repealed.
memberships:
  # Acceded to the EU on 2004-05-01 (to verify).
  - organisation: EU
    from_date: 2004-05-01
coverage:
  corpus_status: pilot
  known_gaps:
    - Acts of the Sbírka zákonů listed in the manifest (the Constitution and Charter, the main codes and procedure codes, the data-protection act and a set of other main acts with their whole history up to 2026-10-14) plus the version in force of every other act and decree of the Sbírka zákonů in the open-data dumps; no Sbírka mezinárodních smluv (treaties), no Úřední list or other historical collections, no municipal or regional ordinances, no explanatory memoranda and no case law.
    - Czech only.
    - History is the time versions the manifest asks for (all up to the retrieval date for the listed acts, the version in force for the others); versions that take effect after the retrieval date are not ingested; the as-promulgated text is ingested only for an act that has no consolidated version starting the same day.
    - Versions are whole-act snapshots dated by their effective-from and effective-to days; a part of a version with a later effective day is dated from that day.
    - The time versions are shown by the publisher as the consolidated text; ULIS marks them official but not authoritative (to verify the legal force under zákon 222/2016 Sb.).
    - Links between acts are not stored as cross-references (the dump gives only link ids; its link dataset is not used); footnotes are kept as notes of the provisions that mark them; tables are flattened to text; annexes are one flattened provision; text that continues after a list is appended to the text of the provision that holds the list.
    - Czech has no PostgreSQL text-search configuration, so the "simple" configuration is used (no stemming; Czech is highly inflected, so searches need the exact word forms).
