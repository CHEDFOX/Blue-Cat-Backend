# REAL JURISDICTION - DRAFT, UNVERIFIED. The European Union's own legal order (primary and
# secondary EU law). How EU law applies inside each Member State (primacy, direct effect,
# Member State memberships) is NOT modelled here.
schema_version: 1
id: EU
profile_version: 0.3.0
name: European Union
names:
  en: European Union
  fr: Union européenne
  de: Europäische Union
kind: regional_organisation
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [bg, cs, da, de, el, en, es, et, fi, fr, ga, hr, hu, it, lt, lv, mt, nl, pl, pt, ro, sk, sl, sv]
legal_system:
  families: [sui_generis]
  structure: international_organisation
  treaty_reception: monist
  notes: >-
    To verify - a legal order founded on the Treaty on European Union and the Treaty on the
    Functioning of the European Union, which have the same legal value (TFEU, art 1(2)); the
    Charter of Fundamental Rights has the same legal value as the Treaties (TEU, art 6(1)).
    The Treaty texts are equally authentic in 24 languages (TEU, art 55(1)). Agreements
    concluded by the Union are binding upon its institutions and on its Member States (TFEU,
    art 216(2)); "monist" is recorded on that basis and must be confirmed. A regulation is
    binding in its entirety and directly applicable in all Member States; a directive is
    binding, as to the result to be achieved, upon each Member State to which it is addressed
    (TFEU, art 288). The effect of EU law in Member State law (primacy, direct effect,
    transposition) is not modelled in ULIS yet.
legislative_institutions:
  - id: EU-EP
    name: European Parliament
    instrument_types: [regulation, directive, decision]
  - id: EU-COUNCIL
    name: Council of the European Union
    instrument_types: [regulation, directive, decision]
  - id: EU-COM
    name: European Commission
    instrument_types: [regulation, directive, decision]
# founding_treaty = TEU and TFEU; charter = Charter of Fundamental Rights. Both are primary law
# of the same rank (see notes); a list cannot express a tie, so the Charter is listed second.
instrument_types: [founding_treaty, charter, regulation, directive, decision]
norm_hierarchy: [founding_treaty, charter, regulation, directive, decision]
courts:
  - id: EU-CJEU
    name: Court of Justice
    rank: 1
  - id: EU-GC
    name: General Court
    rank: 2
    appeals_to: [EU-CJEU]
precedent:
  doctrine: jurisprudence_constante
  vertical_binding: false
  notes: >-
    To verify - the Court of Justice does not apply stare decisis: it is not formally bound by its
    earlier judgments, but follows its settled case law and departs from it only with reasons. It
    has the final say on the interpretation and validity of EU law (TEU art 19(1); TFEU art 267).
    A preliminary ruling on interpretation (TFEU art 267) binds the referring court, and in
    practice national courts apply it to the same question of EU law; national courts of last
    instance must refer a question of EU law unless the Court's case law has already settled it or
    the answer is beyond reasonable doubt (see Cilfit and Others, 283/81, ingested). The General
    Court's judgments in direct actions bind the parties and may be appealed to the Court of
    Justice on points of law only (TFEU art 256(1)). How case law of the Court operates inside
    each Member State is not modelled; the weight shown for a judgment is that of settled case law
    on EU law, not of binding precedent.
