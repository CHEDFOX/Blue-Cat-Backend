# REAL JURISDICTION - DRAFT, UNVERIFIED. Brazil (federal level). Only decisions of the Superior Tribunal de Justiça (STJ) from
# its open data portal are ingested (docs/jurisdictions/br-case-law.md); no Brazilian legislation is loaded: the Planalto site
# (www.planalto.gov.br) did not answer when it was tried (docs/jurisdictions/latin-america.md). States (estados), municipalities
# and the Distrito Federal are not profiled. The court hierarchy below is written from general knowledge of arts. 92-126 of
# the Constituição Federal (not read from the source here) and from the STJ's own description on the portal; to be verified.
schema_version: 1
id: BR
profile_version: 0.1.0
name: Brazil
names: {en: Brazil, pt: Brasil}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [pt]
legal_system:
  families: [civil_law]
  structure: federal
  treaty_reception: unknown
  notes: >-
    To verify - federal republic of the Union, 26 states, the Distrito Federal and the municipalities (Constituição Federal,
    arts. 1 and 18). Codified civil-law system in which the Union legislates on civil, criminal, procedural and many other
    matters (art. 22 CF). The judiciary is organised in a federal justice (Tribunais Regionais Federais and juízes federais),
    state justice (Tribunais de Justiça and juízes de direito) and specialised justice (labour, electoral and military), with
    the Supremo Tribunal Federal and the Superior Tribunal de Justiça above them (arts. 92-126 CF). Whether treaties
    are received monistically or dualistically is disputed (treaties are approved by decreto legislativo and promulgated by decree;
    human-rights treaties approved with a qualified majority have the rank of constitutional amendments, art. 5 par. 3 CF) and is
    left as unknown here. The language of the Republic is Portuguese (art. 13 CF).
