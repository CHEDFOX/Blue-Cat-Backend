# REAL JURISDICTION - DRAFT, UNVERIFIED. France (national law: the Constitution, the codes, laws, ordinances; decisions of
# the Conseil constitutionnel, the Cour de cassation and the administrative courts). Overseas collectivities with their own
# legislation (New Caledonia, French Polynesia...) are not profiled. EU membership is deliberately not recorded here.
schema_version: 1
id: FR
profile_version: 0.1.0
name: France
names: {fr: France, en: France}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [fr]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - decentralised unitary Republic (communes, departments, regions, overseas collectivities with partly
    separate legislation). Codified civil-law system with a separate administrative jurisdiction (Conseil d'Etat at its
    head) beside the judicial one (Cour de cassation at its head). Treaties duly ratified or approved have, on
    publication, an authority superior to that of statutes, subject to application by the other party (art. 55 of the
    Constitution of 4 October 1958), so reception is monist; the Conseil constitutionnel reviews statutes against the
    Constitution (art. 61, art. 61-1 for the "question prioritaire de constitutionnalité"), the ordinary courts review
    them against treaties.
legislative_institutions:
  - id: FR-PARLEMENT
    name: Parlement (Assemblée nationale and Sénat); the Congrès for constitutional laws; organic laws under art. 46 of the Constitution
    instrument_types: [constitution, constitutional_act, organic_act, act]
  - id: FR-GOUVERNEMENT
    name: Gouvernement (ordonnances under art. 38; décrets of the President of the Republic and the Prime Minister; arrêtés of ministers and other authorities)
    instrument_types: [ordinance, decree_law, decree, order]
instrument_types:
  [constitution, constitutional_act, organic_act, act, ordinance, decree_law, decree, order, code, other_text]
norm_hierarchy:
