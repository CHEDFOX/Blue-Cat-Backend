name: Slovenia
names: {sl: Republika Slovenija, en: Republic of Slovenia}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [sl]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: unknown
  notes: >-
    To verify - unitary parliamentary republic under the Constitution of 1991. The Državni zbor (National Assembly) passes
    laws; the President of the Republic promulgates them by a decree (ukaz o razglasitvi) based on Art. 91 of the Constitution
    (the decree is printed before each law in Uradni list RS); the Government issues decrees (uredbe) and ministers rules
    (pravilniki). Civil-law system with codified law (Austrian and German influences). Municipalities (občine) issue their own
    acts; they are not ingested. How international treaties rank and take effect is not modelled here - to verify.
legislative_institutions:
  - id: SI-DZ
    name: Državni zbor (National Assembly - zakoni, ustavni zakoni; the Constitution is amended by the Assembly)
    instrument_types: [constitution, constitutional_act, act]
  - id: SI-VLADA
    name: Vlada (Government - uredbe, odloki)
    instrument_types: [regulation]
instrument_types: [constitution, constitutional_act, act, regulation, other]
norm_hierarchy: [constitution, constitutional_act, act, regulation]
courts:
  - id: SI-US
    name: Ustavno sodišče Republike Slovenije (Constitutional Court)
    rank: 1
  - id: SI-VS
    name: Vrhovno sodišče Republike Slovenije (Supreme Court)
    rank: 1
  - id: SI-VISJA
    name: Višja sodišča (Higher Courts; appeal instance)
    rank: 2
    appeals_to: [SI-VS]
  - id: SI-OKROZNA
    name: Okrožna sodišča (District Courts; first instance in serious cases, appeal from local courts)
    rank: 3
