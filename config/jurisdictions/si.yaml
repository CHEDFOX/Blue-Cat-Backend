precedent:
  doctrine: no_formal_precedent
  vertical_binding: false
  notes: >-
    To verify - no formal rule of binding precedent for the ordinary courts; the case law of the Vrhovno sodišče is followed in
    practice and cited as persuasive. Decisions of the Ustavno sodišče on constitutionality are binding. The court list is
    simplified (the Upravno sodišče and the labour, social and other specialised courts are not placed) and every entry is a
    draft to verify. Case law is not ingested.
citation:
  module: si
  notes: >-
    From the smallest unit to the largest, the cited unit in the nominative and every container in the genitive, paragraphs
    as ordinal words: "3. člen ZJRM-2", "prvi odstavek 3. člena ZJRM-2", "2. točka prvega odstavka 3. člena ZJRM-2",
    "podtočka a) 2. točke prvega odstavka 3. člena ZJRM-2"; an inserted article is "12.a člen". The act is named by the
    abbreviation in the last parenthesis of its title; a title without one is cited in the genitive ("Zakona o ...") or put
    first ("<title>, 3. člen").
  examples:
    - "1. člen ZJRM-2"
    - "prvi odstavek 3. člena ZJRM-2"
    - "2. točka 2. člena ZPUG"
publication:
  official_sources: [si-uradni-list]
  commencement: >-
    Acts are promulgated by the President and published in Uradni list RS; each act states its own entry into force, usually in
    its last article ("Ta zakon začne veljati trideseti dan po objavi v Uradnem listu Republike Slovenije"). The page of the
    gazette states no commencement date.
  amendment: >-
    Textual amendment by amending laws ("Zakon o spremembah in dopolnitvah ..."), each published in its own issue. The gazette
    does not consolidate; for some laws it publishes an official consolidated text ("uradno prečiščeno besedilo", UPB).
  repeal: >-
    Express repeal by a later act; the source does not mark an older act as repealed.
coverage:
  corpus_status: pilot
  known_gaps:
    - "Each act is the text as published in Uradni list RS; amendments are separate acts and are not applied, so an older law may be amended or repealed. Consolidated texts (UPB) are ingested only where the gazette published them."
    - The source states no entry-into-force date and no end of validity; no validity period is recorded (start unknown), so searches show every provision as in force and point-in-time lookups cannot be answered.
    - Only the acts in the manifest (laws and consolidated texts of January 2023 - February 2026 and five core acts); no regulations, decisions, municipal acts, treaties or case law; the gazette since March 2026 (on pisrs.si) is not ingested.
    - The unofficial consolidated texts of PISRS are not ingested (its terms forbid reproducing the database; its API needs a key).
    - Structure (article, paragraph, point, sub-point) is read from the printed numbering; unusual layouts leave text in the enclosing unit. Tables are reduced to text rows.
    - Whether the HTML page is the authentic publication was not established; it is recorded as non-authentic.
    - "No PostgreSQL text-search configuration exists for Slovenian, so the simple configuration is used (no stemming; inflected forms are matched only when identical)."
