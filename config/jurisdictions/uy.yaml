precedent:
  doctrine: jurisprudence_constante
  vertical_binding: false
  notes: >-
    To verify - there is no formal stare decisis: judgments bind the parties; the Suprema Corte's doctrine is followed in
    practice. The Tribunal de lo Contencioso Administrativo, the Corte Electoral, the labour, family and criminal
    specialised courts and the departmental courts are not listed; the three entries are simplified (one entry stands for
    several courts).
citation:
  module: uy
  notes: >-
    The article first, written out, then the instrument as IMPO and Uruguayan courts name it: "artículo 1308 del Código Civil",
    "artículo 72 de la Constitución de la República", "artículo 9 de la Ley Nº 18.331" (thousands dot), "artículo 3 del Decreto
    Nº 414/009" (number / last three digits of the year). IMPO's own numbering of articles is kept ("9 bis", "242-1", and
    "artículos 131 a 144" for a range IMPO keeps as one entry). Articles are the smallest provisions. The IMPO address is
    kept in ext.impo_path.
  examples:
    - "artículo 1308 del Código Civil"
    - "artículo 72 de la Constitución de la República"
    - "artículo 9 de la Ley Nº 18.331"
    - "artículo 9 bis de la Ley Nº 18.331"
    - "artículo 3 del Decreto Nº 414/009"
    - "artículos 131 a 144 del Código Civil"
publication:
  official_sources: [uy-impo]
  commencement: >-
    To verify - laws are published in the Diario Oficial, which IMPO edits; Ley 19.355 art. 760 recognises the electronic
    Diario Oficial with the same validity as paper (as quoted on https://www.impo.com.uy/marco-juridico/). When a law takes
    effect is stated by the law or the Civil Code; the ingested texts do not record entry-into-force dates.
  amendment: >-
    Textual amendment by later norms. IMPO's editors update the text and note each change in the article's notes ("Redacción
    dada por: Ley Nº 18.719 de 27/12/2010 artículo 152", "Agregado/s por", "Ver vigencia"); ULIS records those notes and one
    amendment event per amending norm, dated with the amending norm's own date.
  repeal: >-
    Express repeal, shown in the updated text as "DEROGADO por ..." or an empty article with a "Derogado/s por:" note. Tacit
    repeal is not reflected in IMPO's texts.
coverage:
  corpus_status: partial
  known_gaps:
    - Only the norms of the source manifest (the Constitution, nine codes, ten laws or decrees on common subjects, and the laws, decree-laws and decrees named in their amendment notes); not the whole of IMPO's database (tens of thousands of laws and decrees), and no resolutions, treaties, departmental law, Diario Oficial issues or bulletins.
    - IMPO's updated text is informative; the Diario Oficial is the publication of record and is not ingested. Only express modifications are recorded.
    - Each text is attested at its retrieval date. When a provision took effect, and earlier wordings of an amended provision, are not recorded (IMPO links only the original text of an article, which is not ingested); amendment events carry the amending norm's date, not the date the change took effect.
    - The Disposiciones Transitorias y Especiales de la Constitución are a separate IMPO norm whose JSON holds all clauses in one entry; they are not ingested.
    - Articles are the smallest provisions. Paragraphs and lettered items stay inside the article text, and lines are re-joined from IMPO's 72-column wrapping.
    - 'IMPO''s JSON gives some entries no text ("(*)" with a pointer to the original text, or "Este artículo dio nueva redacción a: ..." for the articles of an amending law): they are not stored, and 39 of the 214 manifest norms (19th-century laws, decrees whose every article is blanked) hold nothing to store and are skipped; the original-text bases (leyes-originales, decretos-originales) are not ingested.'
    - No case law (Suprema Corte, Tribunales de Apelaciones); courts and precedent rules are a simplified draft ("To verify").
