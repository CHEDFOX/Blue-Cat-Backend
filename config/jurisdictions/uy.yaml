# REAL JURISDICTION - DRAFT, UNVERIFIED. Uruguay (national legislation). Departmental (Intendencias, Juntas Departamentales)
# and municipal law is out of scope.
schema_version: 1
id: UY
profile_version: 0.1.0
name: Uruguay
names: {en: Uruguay, es: Uruguay}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [es]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: unknown
  notes: >-
    To verify - unitary republic of 19 departments with a presidential system; the General Assembly (Senate and Chamber of
    Representatives) enacts laws, the Executive Power (the President acting with the competent minister) issues decrees. A
    codified civil-law system (Código Civil 1868, Código de Comercio, Código Penal 1933, Código General del Proceso 1988 ...).
    Constitutional review of laws belongs to the Suprema Corte de Justicia, and a declaration of unconstitutionality has
    effect only in the case in which it is made (to verify). How treaties take domestic effect is not settled in the
    ingested text and is recorded as unknown. Spanish is the language of the law (the Constitution names no official
    language; to verify). Decree-laws of the 1973-85 de facto government (Decretos-Leyes) are ingested as laws where IMPO
    lists them; the profile does not model de facto legislation.
