# REAL JURISDICTION - DRAFT, UNVERIFIED. Slovakia (national legislation, Zbierka zákonov). Subnational (generally
# binding regulations of municipalities and regions) and ministerial collections are not profiled. EU membership is
# deliberately not recorded here (added separately with the EU profile).
schema_version: 1
id: SK
profile_version: 0.1.0
name: Slovakia
names: {sk: Slovensko, en: Slovakia}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [sk]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - unitary parliamentary republic under the Constitution of the Slovak Republic (Ústava Slovenskej
    republiky, 460/1992 Zb., in force from 1 October 1992, in part from 1 January 1993). Civil-law system (Central
    European tradition: Civil Code 40/1964 Zb., Commercial Code 513/1991 Zb., Criminal Code 300/2005 Z. z., recodified
    civil procedure in 2016). Legislative power belongs to the National Council (Národná rada Slovenskej republiky,
    čl. 72); acts are signed by the President and promulgated in the Collection of Laws (Zbierka zákonov). Treaties
    ratified and promulgated in the prescribed way take precedence over acts, and those on human rights and
    fundamental freedoms that provide a wider scope of rights prevail over acts (čl. 7 ods. 5) - to verify.
    Slovak is the state language and the language of legislation.
legislative_institutions:
  - id: SK-NR
    name: Národná rada Slovenskej republiky (National Council) - constitution, constitutional acts and acts (zákony)
    instrument_types: [constitution, constitutional_act, act]
  - id: SK-EXECUTIVE
    name: Vláda Slovenskej republiky (Government), ministries and other central bodies - regulations (nariadenia vlády, vyhlášky, opatrenia) under statutory authority
