# REAL JURISDICTION - DRAFT, UNVERIFIED. United Kingdom (the state). Its three legal
# jurisdictions (England and Wales, Scotland, Northern Ireland) are child profiles.
schema_version: 1
id: GB
profile_version: 0.3.0
name: United Kingdom
names: {en: United Kingdom of Great Britain and Northern Ireland}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [en]
legal_system:
  families: [common_law, mixed]
  structure: unitary
  treaty_reception: dualist
  notes: >-
    To verify - unitary state with devolved legislatures (Scottish Parliament, Senedd Cymru,
    Northern Ireland Assembly); three legal jurisdictions; Scots law is a mixed system.
    Treaties have domestic effect only through legislation.
legislative_institutions:
  - id: GB-PARL
    name: Parliament of the United Kingdom
    instrument_types: [act, statutory_instrument]
instrument_types: [act, statutory_instrument, bill]
norm_hierarchy: [act, statutory_instrument]
courts:
  - id: GB-UKSC
    name: Supreme Court of the United Kingdom
    rank: 1
precedent:
  doctrine: stare_decisis
  vertical_binding: true
  notes: >-
    To verify - decisions bind lower courts within the jurisdiction from which the appeal came;
    effect across UK jurisdictions depends on whether the law is shared. Criminal appeals from
    Scotland generally end in the High Court of Justiciary.
citation:
  module: gb
  examples:
    - "Human Rights Act 1998, s 4(5)(a)"
    - "Theft Act 1968, sch 1, para 2(1)"
    - "Data Protection (Charges and Information) Regulations 2018, SI 2018/480, reg 2(1)"
publication:
  official_sources: [gb-legislation-gov-uk, gb-uksc-judgments]
  commencement: Acts commence on Royal Assent or as provided, often by commencement regulations.
  amendment: Textual amendment by later Acts and statutory instruments; legislation.gov.uk publishes revised versions.
  repeal: Express repeal; repealed text is shown as dots with an annotation.
memberships:
  # Member from 1 January 1973; left on 31 January 2020. EU law continued to apply during the
  # transition period, so it is treated as applicable until 31 December 2020; afterwards only
  # "retained" (assimilated) law under UK legislation applies, which is not EU law (to verify).
  - organisation: EU
    from_date: 1973-01-01
    to_date: 2021-01-01
coverage:
  corpus_status: pilot
  known_gaps:
    - Every Act and Measure with a revised text on legislation.gov.uk that is not marked repealed in full is ingested in its current version (about 3,900 works, see the source manifest); the point-in-time history of nine works only. Statutory instruments (one from the sample only), Acts of the Northern Ireland Assembly and Acts the site holds only as enacted are not ingested.
    - Case law is 126 UK Supreme Court judgments of 2021-2026 from the Court's own website (gb-uksc-judgments; Open Government Licence); no earlier Supreme Court judgments (PDF only), no Privy Council, Court of Appeal or High Court judgments. Find Case Law requires a separate licence for computational analysis, and BAILII's robots.txt disallows robots.
    - Extent is recorded; "application" (where a provision has practical effect) can differ and is not modelled.
    - Outstanding (unapplied) amendments are reported but not applied.
