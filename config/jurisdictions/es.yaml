# To verify: the order below is the usual one (art. 9.3 CE; treaties once published, art. 96.1 CE); decree_law and decree
# are the pre-1978 forms (Decreto-ley, Decreto) that the consolidated database still holds.
norm_hierarchy:
  - constitution
  - international_agreement
  - organic_law
  - law
  - royal_legislative_decree
  - royal_decree_law
  - decree_law
  - royal_decree
  - decree
  - regulation
  - ministerial_order
  - resolution
  - instruction
  - circular
