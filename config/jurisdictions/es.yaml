# REAL JURISDICTION - DRAFT, UNVERIFIED. Spain (State law). The autonomous communities are not
# profiled yet; their legislation is out of scope.
schema_version: 1
id: ES
profile_version: 0.3.0
name: Spain
names: {en: Spain, es: España}
kind: sovereign_state
parent: INT
fictional: false
verification:
  status: draft_unverified
  notes: Research notes only. Not reviewed by counsel.
official_languages: [es]
legal_system:
  families: [civil_law]
  structure: unitary
  treaty_reception: monist
  notes: >-
    To verify - unitary State organised in autonomous communities with their own legislative
    assemblies ("Estado autonómico", arts. 2 and 137 CE; often described as quasi-federal).
    Castilian is the official State language; Catalan/Valencian, Galician and Basque are
    co-official in their communities (art. 3 CE). Validly concluded international treaties form
    part of the internal legal order once officially published in Spain (art. 96.1 CE). Spain is
    a member of the European Union (membership not recorded in this profile yet).
legislative_institutions:
  - id: ES-CORTES
    name: Cortes Generales
    instrument_types: [organic_law, law]
  - id: ES-GOBIERNO
    name: Gobierno de España
    instrument_types: [royal_legislative_decree, royal_decree_law, royal_decree, decree_law, decree, regulation, agreement]
  - id: ES-MINISTERIOS
    name: Ministerios y organismos de la Administración General del Estado
    instrument_types: [ministerial_order, resolution, instruction, circular]
