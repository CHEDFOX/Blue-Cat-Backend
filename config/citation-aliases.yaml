# Short names that lawyers cite instead of a law's title (ulis/retrieval/citations.py).
#
# Each entry names one instrument of the jurisdiction it is listed under, by `uri`, `number` (instruments.number),
# `title` (exact title or short title) or `ext` (one key of instruments.ext). Names are compared without case, dots,
# spaces or hyphens ("C. consom." = "cconsom", "DS-GVO" = "DSGVO"). A name is used only when its jurisdiction is in
# the scope of the search, so the same abbreviation can mean different laws in different jurisdictions ("CC" is the
# Spanish Civil Code, "C.cr." the Canadian Criminal Code). An entry that names no stored instrument is ignored, and
# the law is then looked up by its title. Laws whose publisher already records the abbreviation (German `jurabk`,
# Japanese `abbrev`) or whose title is what lawyers write ("Code civil", "Data Protection Act 1998", "民法") need no
# entry here. Names of three characters or fewer ("CC", "RL", "ET") are used only when the search names a
# jurisdiction.

