# Austrian federal law (RIS "Bundesrecht konsolidiert", OGD-RIS API v2.6). Licence: CC BY 4.0.
# Each entry is one API query: a Gesetzesnummer, a paragraph/article range and the versions
# wanted - those in force on the given date(s) (fassung_vom) and/or every version (all_versions).
# OGD terms: sequential, >= 2 s between requests, only 20:00-05:00 Vienna time or at weekends;
# announce larger use to ris.it@bka.gv.at. A run is capped at max_network_requests.
# STATUS: this list is the intended selection. It has NOT been run (the OGD access window was not
# open); only § 83 StGB (current version) was retrieved by hand and is a test fixture.
schema_version: 1
source_id: at-ris-bundesrecht
api_base: https://data.bka.gv.at/ris/api/v2.6
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
max_network_requests: 200
off_hours_only: true
works:
  # Bundes-Verfassungsgesetz (B-VG): general provisions, current version
  - {gesetzesnummer: "10000138", sections: [{typ: Artikel, von: 1, bis: 10}], fassung_vom: [2026-10-14]}
  # B-VG Art. 7 (equality), every version
  - {gesetzesnummer: "10000138", sections: [{typ: Artikel, von: 7, bis: 7}], all_versions: true}
  # B-VG Art. 140 (review of laws by the Verfassungsgerichtshof), current version
  - {gesetzesnummer: "10000138", sections: [{typ: Artikel, von: 140, bis: 140}], fassung_vom: [2026-10-14]}
  # Allgemeines bürgerliches Gesetzbuch (ABGB): introduction and damages, current version
  - {gesetzesnummer: "10001622", sections: [{typ: Paragraph, von: 1, bis: 17}, {typ: Paragraph, von: 1293, bis: 1297}], fassung_vom: [2026-10-14]}
  # Strafgesetzbuch (StGB): offences against life and limb, every version
  - {gesetzesnummer: "10002296", sections: [{typ: Paragraph, von: 75, bis: 84}], all_versions: true}
  # Datenschutzgesetz (DSG, until 2018 "DSG 2000"): §§ 1-4, every version
  - {gesetzesnummer: "10001597", sections: [{typ: Paragraph, von: 1, bis: 4}], all_versions: true}
  # Unternehmensgesetzbuch (UGB): §§ 1-7, current version
  - {gesetzesnummer: "10001702", sections: [{typ: Paragraph, von: 1, bis: 7}], fassung_vom: [2026-10-14]}
  # Allgemeines Verwaltungsverfahrensgesetz 1991 (AVG): §§ 1-8, current version
  - {gesetzesnummer: "10005768", sections: [{typ: Paragraph, von: 1, bis: 8}], fassung_vom: [2026-10-14]}
  # Mietrechtsgesetz (MRG): §§ 1-3, current version
  - {gesetzesnummer: "10002531", sections: [{typ: Paragraph, von: 1, bis: 3}], fassung_vom: [2026-10-14]}
