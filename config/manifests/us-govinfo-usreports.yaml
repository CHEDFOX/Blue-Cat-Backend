# United States Reports (Supreme Court of the United States), volumes 2-586, from GovInfo (collection USREPORTS).
# For each volume the connector requests two keyless files from https://www.govinfo.gov, one request at a time, at
# least 5 s apart (about 1,170 requests, roughly 1.7 GB, about two hours of network time plus transfer):
#   /metadata/pkg/USREPORTS-<volume>/mods.xml        (package metadata: every case with title, citation, date, first page)
#   /content/pkg/USREPORTS-<volume>/text/USREPORTS-<volume>.txt   (the "Text rendition" that the MODS links: OCR text of the volume)
# robots.txt of www.govinfo.gov is read first and applies to every URL (it disallows only /core/, /profiles/, search
# paths and /app/search/*; it lists the collection sitemaps). The JSON API (api.govinfo.gov, api key) is not used.
#
# How the volumes were chosen: this is the complete list of volumes in GovInfo's USREPORTS sitemaps
# (https://www.govinfo.gov/sitemap/USREPORTS_sitemap_index.xml and its 167 year sitemaps, read on 2026-10-14): 584
# packages, volumes 2 to 586. GovInfo lists no package for volume 1 (1 U.S., 1 Dall.) or volume 465, and none after 586
# (2018 Term). `year` is only the year of the GovInfo sitemap that lists the package (for volume 410 it is 1974, the
# year in its MODS dateIssued; for early volumes it can be the date of a later reprint); it is informational.
