# Uruguayan national legislation fetched from IMPO (https://www.impo.com.uy) as open data: <base>/bases/<path>?json=true.
# Terms: https://www.impo.com.uy/datos-abiertos/ (Licencia de Datos Abiertos - Uruguay); robots.txt: Crawl-Delay 10, none of
# these paths disallowed (see config/sources/uy-impo.yaml). `path` is IMPO's own address of a norm: <kind>/<number>-<year>.
# The list is the codes, the Constitution, ten laws/decrees on common subjects and every norm that the notes of those texts
# name as amending or regulating them (IMPO offers no list of norms to a non-registered visitor). To extend it, add any
# `bases/<kind>/<number>-<year>` address of a public IMPO norm (kinds supported: constitucion, leyes, decretos-ley, decretos,
# codigo-*); an address IMPO does not know is skipped and reported, not fatal.
schema_version: 1
source_id: uy-impo
base_url: https://www.impo.com.uy
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 10
