# Argentine national legislation fetched from InfoLEG (Ministerio de Justicia, https://www.argentina.gob.ar/normativa).
# Per norm: its summary page /normativa/nacional/norma-<id> and the text page it links to (/actualizacion = "texto
# actualizado", /texto = "texto original"). `id` is InfoLEG's norm id (the number at the end of the page address).
# The Constitution has no updated text on the site, so its "texto original" (the official text ordered by Ley 24.430)
# is used. Terms: https://www.argentina.gob.ar/terminos-y-condiciones (CC BY 4.0); robots.txt: Crawl-delay 10, none of
# these paths disallowed (see config/sources/ar-infoleg.yaml).
schema_version: 1
source_id: ar-infoleg
base_url: https://www.argentina.gob.ar
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 10
laws:
