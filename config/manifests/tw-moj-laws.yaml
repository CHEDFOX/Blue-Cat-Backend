# Laws fetched from 全國法規資料庫 (Laws & Regulations Database, Ministry of Justice), one
# full-text page (所有條文) per law: https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=<PCode>.
# Licence: 政府資料開放授權條款－第1版 (Open Government Data License, version 1.0, compatible with
# CC BY 4.0); see config/sources/tw-moj-laws.yaml. Only /LawClass/LawAll.aspx is allowed by the
# site's robots.txt, and the connector checks robots.txt before every page.
#
# Scope (2026-10-15): every law and regulation page that the sitemap named in robots.txt lists
# (https://law.moj.gov.tw/SearchEngineSitemap.aspx, an allowed path): 11,812 PCodes = the 8 hand-picked laws
# below, then the other 11,804 in sitemap order, written by scripts/build_moj_manifest.py. About a third are
# repealed laws (廢止) and a few are charts published as attachments; the connector fetches them (the sitemap
# does not say) and the parser skips them. A random sample of 160 pages: 52 repealed (33 %), 7 without article
# text, 99 ingested (62 %), 2 refused as errors (a source typo, a 生效狀態 memo naming no article).
# Cost of a full run: one request per page = about 11,800 requests = 16.4 hours at the 5 s crawl delay, about
# 0.65 GB of HTML (55 KB per page); estimated from the sample about 7,300 laws ingested (6,400-8,200), 550,000
# provision versions (75 per law) and about 2 GB of database (1.6-2.7). Responses are cached, so an interrupted
# run resumes without new requests.
