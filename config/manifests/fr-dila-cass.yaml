# CASS: Arrêts publiés de la Cour de cassation (DILA open data) from the DILA open data (https://echanges.dila.gouv.fr/OPENDATA/CASS/).
#
# One stock (Freemium_cass_global_20250713-140000.tar.gz) pinned by size and SHA-256, then the daily archives published after it; the connector downloads the stock once
# (resumable, cached under var/sources/echanges.dila.gouv.fr/), reads the archives as streams, newest first (so the latest
# published version of a decision is the one kept) and yields the selected decisions as published. robots.txt of the host is read
# first (it publishes none: 404, no restrictions); requests are at least 5 s apart.
#
# select: decisions of 2000 onwards (about 40,000 of the 144,000 in the stock); remove year_from for all
schema_version: 1
source_id: fr-dila-cass
database: CASS
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
stock:
  file: Freemium_cass_global_20250713-140000.tar.gz
  date: 2025-07-13
  bytes: 260063213
  sha256: 18658ed203e3cf9cd7f5e61aae7bbfe5d19895eddaa9cb41ecf2aa5dd44ee960
incrementals:
  enabled: true
  through: null   # every archive the host lists after the stock; set a date to stop there
select: {year_from: 2000}
