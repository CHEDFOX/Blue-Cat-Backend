# United States courts of appeals opinions from GovInfo (collection USCOURTS): the 13 courts of appeals, every year the
# collection lists for them.
# For each court-year below the connector requests the sitemap https://www.govinfo.gov/sitemap/USCOURTS/USCOURTS_<court>_<year>_sitemap.xml
# (the packages GovInfo lists for crawlers), then for every package its metadata /metadata/pkg/<package>/mods.xml and the PDF
# of each opinion the MODS lists, one request at a time, at least 5 s apart (about two requests per opinion). robots.txt of
# www.govinfo.gov is read first and applies to every URL. The JSON API (api key) is not used.
#
# How the list was made: the court-year sitemaps of the USCOURTS sitemap index
# (https://www.govinfo.gov/sitemap/USCOURTS_sitemap_index.xml, 3,684 sitemaps for 168 courts, read on 2026-10-14) whose court
# code is one of the courts of appeals modelled in the US profile: ca1-ca11 (US-CA1 ... US-CA11), ca13 (Federal Circuit,
# US-CAFC) and caDC (US-CADC). The list is ordered newest year first, so a partial run gives the most recent opinions.
# District, bankruptcy and special courts (155 more codes) are not in the profile and are not listed.
# Size: the sitemaps seen hold 300 to 2,300 packages for a court in 2023-2024 and a handful for early years (ca9 2024: 436,
# ca5 2024: 2,334, ca13 2024: 615, caDC 2024: 519, ca1 2024: 329); the whole list is tens of thousands of opinions, i.e.
# weeks of polite retrieval. The cache makes a run resumable; `limit_per_sitemap: N` (a manifest key) takes only the first
# N packages of each sitemap.
