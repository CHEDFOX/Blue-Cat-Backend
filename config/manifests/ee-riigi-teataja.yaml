    abbreviation: PS
    group_id: 151381
    versions:
      - "127042011002"   # 2011-07-22 - 2015-08-12
      - "115052015002"   # 2015-08-13 - 2025-07-08
      - "111042025002"   # 2025-07-09 - 2026-02-28
      - "111042025003"   # 2026-03-01 - (in force)
  - name: Karistusseadustik
    abbreviation: KarS
    group_id: 162500
    versions:
      - "109072026028"   # 2026-10-01 - 2026-12-31 (in force on 2026-10-14)
  - name: Võlaõigusseadus
    abbreviation: VÕS
