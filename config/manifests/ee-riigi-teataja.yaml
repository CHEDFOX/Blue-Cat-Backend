      - "106032026010"   # 2026-03-16 - 2026-09-30
      - "130062026052"   # 2026-10-01 - (in force)
  - name: Töölepingu seadus
    abbreviation: TLS
    group_id: 331584
    versions:
      - "103072026034"   # 2026-07-13 - 2026-09-30
      - "103072026035"   # 2026-10-01 - 2026-12-31 (in force on 2026-10-14)
  - name: Haldusmenetluse seadus
    abbreviation: HMS
    group_id: 153445
    versions:
      - "106072023031"   # 2024-01-01 - 2026-12-31 (in force on 2026-10-14)
select:
