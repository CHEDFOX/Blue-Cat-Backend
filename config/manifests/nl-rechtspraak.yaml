# Dutch court decisions fetched from the Open Data van de Rechtspraak web service (data.rechtspraak.nl).
# For each ECLI below the connector requests https://data.rechtspraak.nl/uitspraken/content?id=<ECLI> (one request per
# decision, sequential, at least 5 s apart; the publisher asks for no concurrent requests and allows at most 10 per
# second). robots.txt of the host is read first (it has none: 404).
#
# How the ECLIs were chosen: each one was found (or confirmed) through the ECLI index of the same service,
# https://data.rechtspraak.nl/uitspraken/zoeken?creator=<court>&date=<day or range>&return=DOC, on 2026-10-14, and
# is a Dutch-language decision that the index lists with a document. Decisions whose index entry is an English
# translation ("(Engels)", "(English translation)", "engelse versie") were left out: ECLI:NL:HR:2019:2007 and
# ECLI:NL:RBDHA:2015:7196 are translations of the Urgenda judgments below. The selection is a small, hand-picked
# sample (landmark and typical decisions), not a complete or representative corpus.
schema_version: 1
source_id: nl-rechtspraak
base_url: https://data.rechtspraak.nl
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
decisions:
