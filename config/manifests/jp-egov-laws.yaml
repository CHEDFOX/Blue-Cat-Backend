# Laws fetched from e-Gov 法令検索 (Digital Agency), 法令API Version 2, as XML.
# Licence: Public Data License 1.0 (CC BY 4.0 compatible); see config/sources/jp-egov-laws.yaml.
# history: true fetches every enforced revision since the 1 April 2017 data baseline (one per
# enforcement date); history: false fetches only the revision in force. Revisions not yet in
# force are reported from the revision list as outstanding changes, never fetched as law.
schema_version: 1
source_id: jp-egov-laws
base_url: https://laws.e-gov.go.jp/api/2
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
laws:
  - {law_id: 321CONSTITUTION, history: false}  # 日本国憲法 (Constitution of Japan; never amended)
  - {law_id: 129AC0000000089, history: false}  # 民法 (Civil Code)
  - {law_id: 140AC0000000045, history: true}   # 刑法 (Penal Code)
  - {law_id: 408AC0000000109, history: false}  # 民事訴訟法 (Code of Civil Procedure)
  - {law_id: 415AC0000000057, history: true}   # 個人情報の保護に関する法律 (Act on the Protection of Personal Information)
  - {law_id: 322AC0000000049, history: false}  # 労働基準法 (Labour Standards Act)
  - {law_id: 417AC0000000086, history: false}  # 会社法 (Companies Act)
