# Acts of the Slovak Collection of Laws fetched from the static version of Slov-lex (https://static.slov-lex.sk),
# the Ministry of Justice's script-free portal. For each act the connector reads the history page
# /static/SK/ZZ/<year>/<number>/ and fetches the time-version pages /static/SK/ZZ/<year>/<number>/<YYYYMMDD>.html
# the `versions` policy asks for, oldest first (about 430 pages in all, one every 5 s: about 40 minutes):
#   all      every time version in force on or before as_of (the main codes: the whole history)
#   current  the version in force on as_of
#   since: <date>  the versions in force on or after <date>
# The promulgated text (vyhlasene_znenie.html) is never fetched. To extend: add `- {act: "<year>/<number>"}` lines
# (the year and number of the act in the Collection, e.g. "2005/300" for 300/2005 Z. z.); an act the site does not
# have is reported as a run error and the run continues. Versions that take effect after as_of are not taken.
schema_version: 1
source_id: sk-slovlex-static
base_url: https://static.slov-lex.sk
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
as_of: 2026-10-14
laws:
  # whole history
  - {act: "1992/460", versions: all}   # Ústava Slovenskej republiky (460/1992 Zb.)
  - {act: "1964/40", versions: all}    # Občiansky zákonník (40/1964 Zb.)
