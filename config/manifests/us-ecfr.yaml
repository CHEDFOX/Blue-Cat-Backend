# Electronic Code of Federal Regulations (eCFR): all 50 CFR titles, current text, as one XML file per title from the
# Government Publishing Office's bulk-data collection.
#   https://www.govinfo.gov/bulkdata/ECFR/title-<N>/ECFR-title<N>.xml     (49 files; listing read 2026-10-14)
# Title 35 is reserved: the eCFR lists it as "Reserved" (reserved: true) and the bulk-data collection has no file
# for it, so it is listed here with `reserved: true` and never requested.
# The title names are those of the eCFR's own list (https://www.ecfr.gov/api/versioner/v1/titles.json, whose path
# robots.txt does not disallow; fetched once on 2026-10-14, "up_to_date_as_of" 2026-10-09). The files are regenerated by
# GPO when a title changes (the 2026-10-14 listing shows file dates from May 2024 to 13 Oct 2026), so the manifest pins no SHA-256: each run attests the text as of
# the file's Last-Modified date. An optional `sha256:` on a title would pin one download.
# Sizes seen on 2026-10-14: title 1 0.5 MB, 17 17 MB, 12 39 MB (the larger titles, for example 40, 26 and 42, were not
# downloaded here); the connector reads one title at a time and hands the pipeline one CFR part per document.
schema_version: 1
source_id: us-ecfr
base_url: https://www.govinfo.gov
user_agent: "ULIS-research-bot/0.1 (+https://github.com/CHEDFOX/Blue-Cat-Backend)"
crawl_delay_seconds: 5
