# What `load-all` loads by default: the laws in force of the countries below (and of their states, provinces and regions),
# from the sources that cover them whole. Everything else stays in the catalogue and loads on request: `--all-markets` adds
# the other countries and the `not_yet` sources, `--include-case-law` the court decisions, `--include-history` the old
# editions, `--only SRC` one named source.
#
# First go-live: laws in force of the countries whose national collection is listed in full from the publisher's own index,
# with a clear licence (docs/go-live.md). EU, France, Netherlands, Latvia and the other launch markets follow.
markets: [US, CA, AU, GB, DE, ES, SE, FI, JP]

# Sources of those countries that are not loaded at go-live because they cover only part of their jurisdiction (a few
# states, provinces or sample files), so that an answer would look complete when it is not.
not_yet:
  - us-tx-statutes
  - us-ut-code
  - us-or-ors
  - us-wa-rcw
  - us-gpo-uslm-samples
  - ca-on-e-laws
  - ca-mb-manitoba-laws
  - au-qld-legislation
  - au-tas-legislation
