[package]
name = "ulis-tantivy"
version = "0.1.0"
edition = "2021"
description = "EXPERIMENTAL Tantivy candidate stage for ULIS search (evaluation only; production search runs in PostgreSQL)"
publish = false

[[bin]]
name = "ulis-tantivy"
path = "src/main.rs"

[dependencies]
tantivy = "=0.26.2"
rust-stemmers = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
